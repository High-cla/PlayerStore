<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Probably Stolen — 物品工作台</title>
<style>
/* ============================================================
   设计系统 — App-shell 工作台 (非文档流)
   这是工具不是文档: 固定外壳 + 分栏独立滚动, 功能各有其位。
   层级: topbar(60) / sidebar(248) / content(auto) / drawer(480 覆盖层)
   令牌是本文件配色与尺度的唯一定义处, 改这里即可整体换肤。
   ============================================================ */
:root{
  /* ---- 表面与光 (中性外壳 + 暖色卡片) ----
     外壳(顶栏/导航/工具栏/抽屉/toast/滚动条)与卡片承光面同为中性冷灰;
     暖色只作为"光"存在于卡片: 族色辉光 + 卡顶渐变边 + 卡内暖文字 + 暖族标识.
     两组色分开定义 —— 改卡片不牵连外壳; 改外壳不动卡片.
     渐变是照明系统, 不是装饰: 整列顶部一道环境光, 卡片是这束光下的承光面. */
  --bg:#0a0b0d; --bg-2:#0e1013; --surface:#12151a; --surface-2:#1b1f26; --surface-3:#242a33;
  --border:#252b34; --border-strong:#333b46; --border-3:#454e5c;
  /* 承光面 (只被 .card 消费) —— 中性冷灰底: 卡片是冷面, 暖意来自族色光与卡内暖文字 */
  --card-top:#1b1f26; --card-mid:#161a1f; --card-bot:#13161b;
  --card-hover-top:#262c36; --card-hover-mid:#1d2229; --card-hover-bot:#181c22;
  /* 外壳前景 — 中性冷灰 */
  --fg:#eef0f3; --fg2:#a7b0bc; --fg3:#9aa4b1;
  /* 卡内文字 — 暖色, 按承光面底色(含 13% 族色辉光)校准 AA */
  --fgc:#fdf7f1; --fgc2:#c8b8a8; --fgc3:#b6a390;
  --accent:#ffa03d; --accent-2:#ff5c3d;
  --accent-ink:#1a0e06; --accent-soft:rgba(255,160,61,.14);
  --ok:#3ecf7a; --warn:#ffc247; --bad:#ef5a5a;
  --ok-soft:rgba(62,207,122,.14); --warn-soft:rgba(255,194,71,.14); --bad-soft:rgba(239,90,90,.14);
  /* 尺度 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r1:3px; --r2:5px; --r3:8px;
  --t2xs:11px; --txs:12px; --tsm:13px; --tmd:14.5px; --tlg:17px; --txl:21px; --t2xl:28px;
  /* 布局 */
  --topbar:54px; --nav:234px; --drawer:448px; --z-drawer:40; --z-toast:90;
  --font:"Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  /* ---- 8 暖色族 + 暖中性 ----
     类别身份 = 族色 = 卡片发光色. --c-* 是族色的族内具名别名, 供导航色点/分类 chip 复用,
     改族色时只改 --f-* 一处 (catColor 读的仍是 --c-*).
     色相全部落在 340°–55° 暖区: 红-珊瑚-金-琥珀-橙-铜-梅-沙. */
  --f-ember-1:#ff7a4d;  --f-ember-2:#e03a26;
  --f-rose-1:#ff9aa8;   --f-rose-2:#d1556e;
  --f-amber-1:#ffc766;  --f-amber-2:#f59a1f;
  --f-moss-1:#cfd178;   --f-moss-2:#9aa548;
  --f-orange-1:#ffa951; --f-orange-2:#f5731c;
  --f-copper-1:#d9a273; --f-copper-2:#a8703f;
  --f-plum-1:#cba0c4;   --f-plum-2:#9a6a94;
  --f-sand-1:#e8cfa0;   --f-sand-2:#bfa068;
  --f-none-1:#b3a596;   --f-none-2:#7e7268;
  --c-access_cards:var(--f-plum-1); --c-ammunition_explosives:var(--f-ember-1);
  --c-armor:var(--f-copper-1); --c-chemicals:var(--f-amber-1);
  --c-containers:var(--f-copper-1); --c-currency:var(--f-amber-1);
  --c-documents:var(--f-plum-1); --c-energy_cells:var(--f-plum-1);
  --c-equipment:var(--f-ember-1); --c-farming:var(--f-moss-1);
  --c-food_drink:var(--f-orange-1); --c-goods:var(--f-orange-1);
  --c-husbandry:var(--f-moss-1); --c-lottery:var(--f-sand-1);
  --c-machines_storage:var(--f-copper-1); --c-materials:var(--f-amber-1);
  --c-medical:var(--f-rose-1); --c-medical_chemical:var(--f-rose-1);
  --c-misc:var(--f-sand-1); --c-modules:var(--f-plum-1);
  --c-supplies:var(--f-moss-1); --c-tools:var(--f-orange-1);
  --c-weapons:var(--f-ember-1); --c-weapon_mods:var(--f-copper-1);
  --c-random_drop:var(--f-sand-1); --c-prebuilt:var(--f-sand-1);
  --c-new_items:var(--f-sand-1);
}
/* 族类: 卡片/抽屉带上 .fam-* 即获得 --g1/--g2, 卡顶渐变边与辉光都取自它们 */
.fam-ember {--g1:var(--f-ember-1); --g2:var(--f-ember-2)}
.fam-rose  {--g1:var(--f-rose-1);  --g2:var(--f-rose-2)}
.fam-amber {--g1:var(--f-amber-1); --g2:var(--f-amber-2)}
.fam-moss  {--g1:var(--f-moss-1);  --g2:var(--f-moss-2)}
.fam-orange{--g1:var(--f-orange-1);--g2:var(--f-orange-2)}
.fam-copper{--g1:var(--f-copper-1);--g2:var(--f-copper-2)}
.fam-plum  {--g1:var(--f-plum-1);  --g2:var(--f-plum-2)}
.fam-sand  {--g1:var(--f-sand-1);  --g2:var(--f-sand-2)}
.fam-none  {--g1:var(--f-none-1);  --g2:var(--f-none-2)}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r1)}
html,body{height:100%}
body{font:var(--tmd)/1.5 var(--font);background:var(--bg);color:var(--fg);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2e3644;border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#3d4759;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 外壳 ---------- */
.app{display:flex;flex-direction:column;height:100vh}

/* ---------- 顶栏: 光源在应用之上 ---------- */
.topbar{height:var(--topbar);flex-shrink:0;display:flex;align-items:center;gap:var(--s4);
  padding:0 var(--s4);position:relative;z-index:5;
  background:linear-gradient(180deg,#181c23 0%,#101318 100%);
  border-bottom:1px solid var(--border)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent 4%,rgba(255,160,61,.45) 30%,
             rgba(255,92,61,.30) 62%,transparent 96%)}
.brand{display:flex;align-items:center;gap:var(--s2);flex-shrink:0}
.brand-mark{width:26px;height:26px;border-radius:var(--r1);background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font:600 var(--t2xs)/1 var(--mono);letter-spacing:.5px;
  box-shadow:0 0 14px -4px var(--accent)}
.brand-text{font-weight:600;font-size:var(--tmd);white-space:nowrap;letter-spacing:-.01em}
.search-wrap{flex:1;max-width:520px;position:relative}
.search-wrap input{width:100%;height:32px;padding:0 34px 0 11px;color:var(--fg);font-size:var(--tsm);
  background:linear-gradient(180deg,#0b0d11,#101419);
  border:1px solid var(--border-strong);border-radius:var(--r1);
  transition:border-color .15s ease,box-shadow .15s ease}
.search-wrap input::placeholder{color:var(--fg3)}
.search-wrap input:focus{outline:none;border-color:#b8703a;
  box-shadow:0 0 0 3px rgba(255,160,61,.15),0 0 22px -6px rgba(255,122,31,.45)}
.search-wrap kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;
  font:var(--t2xs)/1 var(--mono);color:var(--fg3);background:var(--surface-3);
  border:1px solid var(--border);border-radius:3px;padding:3px 6px}
.status{display:flex;align-items:center;gap:var(--s2);font-size:var(--txs);color:var(--fg2);
  margin-left:auto;white-space:nowrap;max-width:340px;overflow:hidden}
.status span:last-child{overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 35% 35%,#98a2af,#5b6470);
  box-shadow:0 0 0 3px rgba(152,162,175,.10)}
.dot.on{background:radial-gradient(circle at 35% 35%,#7ce8a8,#2fae63);box-shadow:0 0 0 3px var(--ok-soft)}
.dot.off{background:radial-gradient(circle at 35% 35%,#ff8b8b,#c93a3a);box-shadow:0 0 0 3px var(--bad-soft)}
.dot.warn{background:radial-gradient(circle at 35% 35%,#ffd479,#c99020);box-shadow:0 0 0 3px var(--warn-soft)}
.icon-btn{width:32px;height:32px;border-radius:var(--r1);display:grid;place-items:center;
  color:var(--fg2);font-size:var(--tmd);flex-shrink:0;
  transition:background .15s ease,color .15s ease}
.icon-btn:hover{background:var(--surface-3);color:var(--fg)}
.icon-btn.on{background:var(--accent-soft);color:var(--accent);box-shadow:0 0 14px -4px var(--accent)}

/* ---------- 主体分栏 ---------- */
.body{flex:1;display:flex;min-height:0}

/* ---------- 左栏分类导航 ---------- */
.sidebar{width:var(--nav);flex-shrink:0;border-right:1px solid var(--border);
  background:linear-gradient(180deg,#111419,#0c0f13 70%);
  display:flex;flex-direction:column;min-height:0}
.nav-scroll{flex:1;overflow-y:auto;padding:var(--s3) var(--s2) var(--s5)}
.nav-pinned{display:flex;flex-direction:column;gap:2px;padding-bottom:var(--s2);
  border-bottom:1px solid var(--border);margin-bottom:var(--s3)}
.nav-group{margin-bottom:var(--s3)}
.nav-group-t{font-family:var(--mono);font-size:var(--t2xs);font-weight:600;letter-spacing:.14em;
  color:var(--fg3);text-transform:uppercase;padding:var(--s2) var(--s3) var(--s1)}
.nav-item{width:100%;display:flex;align-items:center;gap:var(--s2);padding:7px var(--s3);
  border-radius:var(--r1);color:var(--fg2);font-size:var(--tsm);text-align:left;
  border-left:2px solid transparent;position:relative;
  transition:background .15s ease,color .15s ease,border-color .15s ease}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--fg)}
.nav-item.active{color:#fff;font-weight:600;border-left-color:var(--accent);
  background:linear-gradient(90deg,rgba(255,160,61,.16),rgba(255,122,31,.04) 55%,transparent)}
.nav-item .swatch{width:8px;height:8px;border-radius:2px;flex-shrink:0;
  box-shadow:0 0 8px -1px currentColor}
.nav-item .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .n{font:var(--t2xs)/1 var(--mono);color:var(--fg3);background:var(--surface-3);
  padding:3px 6px;border-radius:99px;min-width:24px;text-align:center}
.nav-item.active .n{background:transparent;color:var(--accent);padding-right:0}

/* ---------- 内容区 ---------- */
.content{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{height:46px;flex-shrink:0;display:flex;align-items:center;gap:var(--s4);
  padding:0 var(--s4);border-bottom:1px solid var(--border);
  background:#101318;position:relative;z-index:4}
.views{display:flex;gap:var(--s5)}
.view-tab{padding:15px 0 12px;font-family:var(--mono);font-size:var(--t2xs);letter-spacing:.11em;
  text-transform:uppercase;color:var(--fg3);display:flex;align-items:center;gap:6px;
  white-space:nowrap;position:relative;transition:color .15s ease}
.view-tab:hover{color:var(--fg2)}
.view-tab.active{color:var(--fg);font-weight:600}
.view-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.view-tab .tab-n{font:var(--t2xs)/1 var(--mono);color:var(--fg3);background:var(--surface-3);
  padding:3px 6px;border-radius:99px;min-width:22px;text-align:center}
.view-tab.active .tab-n{color:var(--accent)}
.toolbar-right{margin-left:auto;display:flex;align-items:center;gap:var(--s3)}
.text-btn{padding:6px 12px;border-radius:var(--r1);color:var(--fg2);font-size:var(--tsm);
  border:1px solid var(--border-strong);
  transition:background .15s ease,border-color .15s ease,color .15s ease}
.text-btn:hover{background:rgba(255,255,255,.055);color:var(--fg);border-color:var(--border-3)}
.result-count{font:var(--tsm)/1 var(--mono);color:var(--fg3);white-space:nowrap}
.view-extra{flex-shrink:0;padding:var(--s3) var(--s4);border-bottom:1px solid var(--border);background:#101318}
.view-extra:empty{display:none}
.extra-row{display:flex;align-items:center;gap:var(--s3)}
.extra-row input{flex:1;max-width:340px;height:32px;padding:0 10px;background:var(--surface-2);
  border:1px solid var(--border-strong);border-radius:var(--r1);color:var(--fg);font-size:var(--tsm)}
.extra-row input:focus{outline:none;border-color:var(--accent)}
/* 滚动容器 = 整列环境光的载体 (顶部亮、向下衰减) */
.scroll-area{flex:1;overflow-y:auto;min-height:0;
  background:
    radial-gradient(130% 52% at 50% -14%,#1c222b 0%,#12161c 42%,transparent 78%),
    radial-gradient(90% 40% at 88% 4%,rgba(255,160,61,.055) 0%,transparent 62%),
    var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));
  align-content:start;border-top:1px solid var(--border);border-left:1px solid var(--border)}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}

/* ---------- 卡片: 环境光下的承光面 ---------- */
.card{position:relative;
  /* 卡片字体: IBM Plex Mono —— 与 slice-dark.html 同款, base64 内嵌于 @font-face.
     作用域限定在 .card: 子元素(.card-id/.cat-chip/.btn)继承, 抽屉与外壳不受影响.
     字体栈与 slice-dark 逐字相同; 缺字回退 Cascadia Mono. 中文仍走 --font 的 Noto Sans SC. */
  --mono:"IBM Plex Mono","Cascadia Mono",Consolas,monospace;
  background:linear-gradient(180deg,var(--card-top) 0%,var(--card-mid) 46%,var(--card-bot) 100%);
  border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:var(--s4) 15px var(--s3);cursor:pointer;display:flex;flex-direction:column;gap:var(--s2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 -10px 28px -20px var(--g1,var(--f-none-1));
  transition:background .2s ease,box-shadow .2s ease}
/* 卡顶 2px 渐变边 —— 族色身份作为光, 不是左侧色条 */
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;z-index:2;
  background:linear-gradient(90deg,var(--g1,var(--f-none-1)),var(--g2,var(--f-none-2)),transparent 94%);
  opacity:.9;transition:opacity .2s ease}
/* 族色辉光: 上部径向 + 右下角过渡, 强度收敛到 .13 (26 类别同时发光不吵) */
.card::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(126% 74% at 8% -8%,var(--g1,var(--f-none-1)) 0%,transparent 70%),
    linear-gradient(202deg,transparent 48%,color-mix(in srgb,var(--g1,var(--f-none-1)) 24%,transparent) 100%);
  opacity:.13;transition:opacity .22s ease}
.card>*{position:relative;z-index:1}
.card:hover{background:linear-gradient(180deg,var(--card-hover-top) 0%,var(--card-hover-mid) 48%,var(--card-hover-bot) 100%);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--g1,var(--f-none-1)) 38%,transparent),
             0 10px 30px -14px color-mix(in srgb,var(--g2,var(--f-none-2)) 66%,transparent),
             0 -12px 34px -18px var(--g1,var(--f-none-1))}
.card:hover::after{opacity:.26}
/* 键盘可达: 卡片本身是 role=button */
.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.card-name{font-size:var(--tmd);font-weight:600;color:var(--fgc);padding-right:34px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-en{font-size:var(--txs);color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-cats{display:flex;flex-wrap:wrap;gap:5px;min-height:23px}
/* 分类 chip: 族色作点, 文字保持中性 (深底上彩色小字难达 AA) */
.cat-chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:var(--t2xs);
  letter-spacing:.1em;text-transform:uppercase;color:var(--fg2);
  background:rgba(255,255,255,.045);padding:3px 8px;border-radius:2px}
.cat-chip i{width:6px;height:6px;border-radius:50%;flex-shrink:0;box-shadow:0 0 7px -1px currentColor}
.card-id{font:var(--t2xs)/1.4 var(--mono);color:var(--fg2);background:rgba(255,255,255,.05);
  padding:3px 7px;border-radius:2px;align-self:flex-start;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 描述钳位 2 行 + 固定高度 ⇒ 卡片等高由构造保证, 不靠 margin-top:auto 撑 */
.card-desc{font-size:var(--txs);color:var(--fg2);line-height:1.55;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:38px;
  padding-top:var(--s2);border-top:1px solid var(--border)}
.card-desc:empty::before{content:"暂无描述";color:var(--fg3);font-style:italic}
/* 按钮排: 生成 / 生成十个 / 详情 —— 允许换行, 窄卡不会横向溢出 */
.card-foot{margin-top:auto;padding-top:var(--s3);display:flex;align-items:center;
  gap:var(--s2);flex-wrap:wrap;min-height:42px}
.foot-right{margin-left:auto;display:flex;gap:var(--s2)}
.fav{position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:var(--r1);
  display:grid;place-items:center;font-size:15px;color:var(--fg3);z-index:3;
  transition:background .15s ease,color .15s ease}
.fav:hover{background:rgba(255,255,255,.1);color:var(--warn)}
.fav.on{color:var(--warn);text-shadow:0 0 12px var(--warn)}
.btn{height:30px;padding:0 13px;border-radius:var(--r1);font-family:var(--mono);
  font-size:var(--t2xs);font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);
  display:inline-flex;align-items:center;gap:6px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 10px rgba(255,92,61,.20);
  transition:filter .16s ease,box-shadow .16s ease,transform .07s ease}
.btn:hover{filter:brightness(1.11);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 5px 18px rgba(255,92,61,.34)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:progress}
.btn.ok{background:linear-gradient(135deg,#5ce09a,#2fae63);color:#04160c;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 3px 14px -3px #2fae63}
.btn.bad{background:linear-gradient(135deg,#ff7a7a,#d63c3c);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 3px 14px -3px #d63c3c}
.btn.ghost{background:transparent;color:var(--fg2);border:1px solid var(--border-strong);
  font-weight:400;letter-spacing:.1em;box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.055);color:var(--fg);border-color:var(--border-3)}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn.danger:hover{background:var(--bad);color:#fff}
.pill-note{font-size:var(--t2xs);color:var(--fg3);display:inline-flex;align-items:center;gap:5px}
.grid.compact .card{padding:10px 11px 9px;gap:5px}
.grid.compact .card-name{font-size:var(--txs)}
.grid.compact .card-desc{display:none}
.grid.compact .card-id{font-size:10px}

/* 卡片内文字走暖色令牌 (--fgc*), 外壳文字仍用 --fg* —— 暖色不外泄到背景/导航/抽屉 */
.card .card-en,.card .card-desc,.card .card-id,.card .cat-chip{color:var(--fgc2)}
.card .card-desc:empty::before,.card .fav{color:var(--fgc3)}
.card .card-id{background:rgba(255,255,255,.06)}
.card .cat-chip{background:rgba(255,255,255,.05)}
.card .card-desc{border-top-color:rgba(255,255,255,.07)}
.card .fav:hover{background:rgba(255,255,255,.1)}
.card .btn.ghost{color:var(--fgc2)}
.card .btn.ghost:hover{color:var(--fgc);background:rgba(255,255,255,.06)}

/* ---------- 行列表 (库存 / 我的生成) ---------- */
.row-list{padding:var(--s4);display:flex;flex-direction:column;gap:6px}
.row-list.compact{padding:var(--s3);gap:4px}
.row{position:relative;display:flex;align-items:center;gap:var(--s3);
  background:linear-gradient(180deg,#1b1f26,#161a1f);border:1px solid var(--border);
  border-radius:var(--r1);padding:var(--s3) var(--s4);cursor:pointer;text-align:left;width:100%;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;border-radius:var(--r1) 0 0 var(--r1);
  background:linear-gradient(180deg,var(--g1,var(--f-none-1)),var(--g2,var(--f-none-2)))}
.row:hover{border-color:color-mix(in srgb,var(--g1,var(--f-none-1)) 40%,var(--border-strong));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 22px -12px var(--g1,var(--f-none-1))}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-name{font-size:var(--tsm);font-weight:600;color:#f5f7f9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font:var(--t2xs)/1.4 var(--mono);color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-nums{display:flex;gap:var(--s3);flex-shrink:0;font:var(--txs)/1 var(--mono);color:var(--fg2)}
.row-loc{font-family:var(--mono);font-size:var(--t2xs);letter-spacing:.1em;
  color:var(--g1,var(--accent));background:color-mix(in srgb,var(--g1,var(--accent)) 14%,transparent);
  padding:3px 9px;border-radius:2px;flex-shrink:0;white-space:nowrap}
.row-acts{display:flex;gap:6px;flex-shrink:0}
.mini-btn{height:26px;padding:0 10px;border-radius:2px;font-size:var(--t2xs);
  background:rgba(255,255,255,.06);color:var(--fg2);
  transition:background .15s ease,color .15s ease}
.mini-btn:hover{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink)}
.mini-btn.danger{background:var(--bad-soft);color:var(--bad)}
.mini-btn.danger:hover{background:var(--bad);color:#fff}
.empty{grid-column:1/-1;text-align:center;color:var(--fg3);padding:64px var(--s5);font-size:var(--tsm)}
.row-list .empty{grid-column:auto}
.empty b{color:var(--fg2)}

/* ---------- 右侧抽屉 ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,7,9,.66);opacity:0;pointer-events:none;
  transition:opacity .18s ease;z-index:var(--z-drawer)}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:var(--drawer);max-width:100vw;
  background:linear-gradient(180deg,#181d24,#0f1216);
  border-left:1px solid var(--border-strong);z-index:calc(var(--z-drawer) + 1);
  display:flex;flex-direction:column;transform:translateX(100%);
  transition:transform .2s cubic-bezier(.22,.7,.3,1);
  box-shadow:-28px 0 64px rgba(0,0,0,.55)}
.drawer.show{transform:translateX(0)}
/* 抽屉顶边继承当前物品族色, 与卡片同源 */
.drawer::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;z-index:3;pointer-events:none;
  background:linear-gradient(90deg,var(--g1,var(--f-none-1)),var(--g2,var(--f-none-2)),transparent 88%);
  box-shadow:0 0 24px -2px var(--g1,var(--f-none-1))}
.drawer-head{flex-shrink:0;display:flex;align-items:flex-start;gap:var(--s3);
  padding:var(--s4) var(--s5);border-bottom:1px solid var(--border);position:relative;
  background:radial-gradient(120% 130% at 0% 0%,color-mix(in srgb,var(--g1,var(--f-none-1)) 16%,transparent) 0%,transparent 58%)}
.dh-main{flex:1;min-width:0}
.dh-main h2{font-size:var(--tlg);font-weight:600;color:#fff;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.dh-sub{font:var(--txs)/1.5 var(--mono);color:var(--fg3);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-tabs{flex-shrink:0;display:flex;gap:var(--s4);padding:0 var(--s5);
  border-bottom:1px solid var(--border)}
.drawer-tabs:empty{display:none}
.drawer-tabs button{padding:12px 0;font-family:var(--mono);font-size:var(--t2xs);
  letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color .15s ease,border-color .15s ease}
.drawer-tabs button:hover{color:var(--fg2)}
.drawer-tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.drawer-body{flex:1;overflow-y:auto;padding:var(--s4) var(--s5)}
.drawer-foot{flex-shrink:0;display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s5);
  border-top:1px solid var(--border);background:#0e1114}
.drawer-foot:empty{display:none}
.pane{display:none}
.pane.show{display:block}
.sec-t{font-family:var(--mono);font-size:var(--txs);font-weight:600;color:var(--fg2);
  letter-spacing:.1em;text-transform:uppercase;
  margin:var(--s4) 0 var(--s2);padding-bottom:6px;border-bottom:1px solid var(--border)}
.sec-t:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:88px 1fr;gap:7px var(--s3);font-size:var(--txs);margin-bottom:var(--s3)}
.kv dt{color:var(--fg3)}
.kv dd{color:var(--fg2);word-break:break-word;font-family:var(--mono)}
.kv dd.plain{font-family:var(--font)}
.desc-full{font-size:var(--tsm);color:var(--fg2);line-height:1.65;white-space:pre-wrap;margin-bottom:var(--s3)}
.fld{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s2)}
.fld label{width:104px;flex-shrink:0;color:var(--fg3);font-size:var(--txs);text-align:right}
.fld input,.fld textarea{flex:1;min-width:0;background:#0b0d11;border:1px solid var(--border-strong);
  color:var(--fg);border-radius:var(--r1);padding:7px 10px;font-size:var(--tsm)}
.fld textarea{font-family:inherit;resize:vertical;min-height:52px;line-height:1.5}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(255,160,61,.15)}
.tr{background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:var(--r1);
  padding:var(--s2) var(--s3);margin-bottom:6px;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.tr .k{font:var(--txs)/1 var(--mono);color:var(--fg);min-width:132px}
.tr .v{font:var(--t2xs)/1.4 var(--mono);color:var(--fg3);flex:1;min-width:120px}
.tr select,.tr input{background:#0b0d11;border:1px solid var(--border-strong);color:var(--fg);
  border-radius:2px;padding:5px 8px;font-size:var(--txs)}
.tr input.tval{width:132px;flex:none}
.pane-empty{color:var(--fg3);font-size:var(--tsm);text-align:center;padding:var(--s5)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:var(--s5);transform:translate(-50%,16px);z-index:var(--z-toast);
  background:linear-gradient(180deg,#262c36,#1b1f26);
  border:1px solid var(--border-3);color:var(--fg);
  padding:var(--s3) var(--s5);border-radius:var(--r1);font-size:var(--tsm);max-width:min(560px,90vw);
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;
  box-shadow:0 12px 36px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:#2fae63;box-shadow:0 12px 36px rgba(0,0,0,.6),0 0 22px -8px #2fae63}
.toast.bad{border-color:#d63c3c;box-shadow:0 12px 36px rgba(0,0,0,.6),0 0 22px -8px #d63c3c}

/* 窄屏: 左栏转为横向分类条, 不隐藏 (隐藏会让分类不可达) */
@media (max-width:900px){
  .body{flex-direction:column}
  .sidebar{width:100%;max-height:150px;border-right:none;border-bottom:1px solid var(--border)}
  .nav-scroll{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:var(--s2)}
  .nav-pinned,.nav-group{display:flex;flex-direction:row;gap:6px;border:none;margin:0;padding:0}
  .nav-group-t{display:none}
  .nav-item{width:auto;white-space:nowrap;padding:6px 10px;border-left:0;
    border-bottom:2px solid transparent;border-radius:var(--r1)}
  .nav-item.active{border-left:0;border-bottom-color:var(--accent);
    background:linear-gradient(180deg,rgba(255,160,61,.16),transparent)}
  .drawer{width:100vw}
  .toolbar{padding:0 var(--s3);gap:var(--s4)}
  .views{gap:var(--s4)}
  .grid,.row-list{padding:var(--s3)}
  .topbar{gap:var(--s2)}
  .status{max-width:150px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

// ===== 左栏导航 =====
function renderNav(){
  const counts = catCounts();
  // renderNav 重建 DOM, 记住当前焦点以便键盘连续切换分类
  const focused = (document.activeElement && document.activeElement.dataset) ? document.activeElement.dataset.cat : null;
  const row = (key, label, n, dot) => `
    <button class="nav-item ${S.cat===key?'active':''}" type="button" data-cat="${esc(key)}" aria-pressed="${S.cat===key}">
      ${dot ? `<i class="swatch" style="background:${dot}"></i>` : ''}
      <span class="label">${esc(label)}</span><span class="n">${n}</span>
    </button>`;
  let html = '<div class="nav-pinned">'
    + row('ALL','全部物品', ITEMS.length, null)
    + row('FAV','收藏', S.fav.size, ROOT_CS.getPropertyValue('--warn').trim())
    + '</div>';
  for(const [title, keys] of CAT_GROUPS){
    const present = keys.filter(k => counts[k]);
    if(!present.length) continue;
    html += `<div class="nav-group"><div class="nav-group-t">${esc(title)}</div>`
      + present.map(k => row(k, zCat(k), counts[k], catColor(k))).join('')
      + '</div>';
  }
  navList.innerHTML = html;
  navList.querySelectorAll('.nav-item').forEach(b => b.onclick = () => {
    S.cat = b.dataset.cat;
    if(S.view !== 'catalog') setView('catalog'); else { renderNav(); renderContent(); }
  });
  // 焦点回填: 键盘连续切换分类时焦点不丢 (与重构前行为一致)
  if(focused){
    const again = navList.querySelector('.nav-item[data-cat="' + CSS.escape(focused) + '"]');
    if(again) again.focus();
  }
}

// ===== 视图 =====
function setView(v){
  S.view = v;
  document.querySelectorAll('.view-tab').forEach(t => {
    const on = t.dataset.view === v;
    t.classList.toggle('active', on);
    t.setAttribute('aria-selected', String(on));
  });
  const isCatalog = v === 'catalog';
  grid.hidden = !isCatalog;
  rowList.hidden = isCatalog;
  if(!isCatalog) S.cat = 'ALL';
  renderNav();
  renderViewExtra();
  renderContent();
}
function renderViewExtra(){
  if(S.view === 'catalog'){ viewExtra.innerHTML = ''; return; }
  const isInv = S.view === 'inventory';
  const ph = isInv ? '过滤库存 — 名称 / ID' : '过滤我的生成 — 名称 / ID';
  const hint = isInv ? '点任意行打开检查器, 可编辑字段 / 标签 / 特性或删除' : '本次会话生成的物品; 服务器已无的记录会自动清理';
  viewExtra.innerHTML = `<div class="extra-row">
    <input type="search" id="subSearch" placeholder="${ph}" value="${esc(S.subQ)}" aria-label="${ph}">
    <span class="pill-note">${hint}</span></div>`;
  $('subSearch').oninput = e => { S.subQ = e.target.value; renderContent(); };
}
function setDensity(d){
  S.density = d;
  localStorage.setItem('ps_density', d);
  const compact = d === 'compact';
  grid.classList.toggle('compact', compact);
  rowList.classList.toggle('compact', compact);
  $('densityBtn').classList.toggle('on', compact);
  $('densityBtn').title = compact ? '当前: 紧凑 — 点击切换为舒适' : '当前: 舒适 — 点击切换为紧凑';
}

// ===== 匹配 =====
function matches(i){
  if(S.cat === 'FAV' && !S.fav.has(i.stableId)) return false;
  if(S.cat !== 'ALL' && S.cat !== 'FAV' && !(i.categories||[]).includes(S.cat)) return false;
  if(!S.q) return true;
  const q = S.q.toLowerCase();
  return (i.nameZh||'').toLowerCase().includes(q)
      || (i.nameEn||'').toLowerCase().includes(q)
      || (i.stableId||'').toLowerCase().includes(q)
      || (i.descriptionZh||'').toLowerCase().includes(q)
      || (i.descriptionEn||'').toLowerCase().includes(q);
}
function catChips(cats, max){
  return (cats||[]).slice(0, max).map(c =>
    `<span class="cat-chip"><i style="background:${catColor(c)}"></i>${esc(zCat(c))}</span>`).join('');
}

  else if(S.view === 'inventory') renderInventory();

function renderCatalog(){
  const list = ITEMS.filter(matches);
  // 收藏置顶, 其余保持数据源顺序 (sort 稳定, 不重排源数组)
  list.sort((a,b) => (S.fav.has(b.stableId)?1:0) - (S.fav.has(a.stableId)?1:0));
  $('count').textContent = list.length + ' / ' + ITEMS.length + ' 项';
  if(!list.length){
    grid.innerHTML = `<div class="empty">没有匹配的物品${S.q ? ` — 没有与「${esc(S.q)}」匹配的结果` : ''}</div>`;
    return;
  }

// ===== API 层 =====
// 唯一入口。返回【已解析的对象】—— 调用方不要再 .json(), 那会抛 TypeError。
const API = 'http://localhost:26880';
const API_TIMEOUT = 8000;
// 主线程可能被大存档长时间占用, 探针给更宽预算
const API_HEALTH_TIMEOUT = 15000;
async function apiFetch(path, ms = API_TIMEOUT){
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), ms);
  try{
    const r = await fetch(API + path, { signal: ctl.signal });
    const text = await r.text();
    let j = null;
    if(text){ try{ j = JSON.parse(text); }catch{ j = null; } }
    if(!j) return { ok:false, err:'HTTP ' + r.status + ' 响应非 JSON' };
    if(typeof j.ok === 'undefined') j.ok = r.ok;
    return j;
  }catch(e){
    if(e && e.name === 'AbortError') return { ok:false, err:'请求超时 (' + ms + 'ms) — 主线程可能被大存档占用' };
    return { ok:false, err:String(e) };
  }finally{ clearTimeout(timer); }
}
let _toastTimer = 0;
function toast(msg, cls){
  clearTimeout(_toastTimer);   // 连点时后一条不再被前一条的清零提前打断
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (cls||'');
  _toastTimer = setTimeout(()=>{ t.className = 'toast'; }, 2600);
}
// 两级探针: /api/health 只证明 HTTP 线程存活 (不触主线程); /api/mine 走主线程,
// 才能证明主线程可达 (未进存档/窗口失焦时主线程排空停摆, 此时点「生成」只会入队而无产物).
let _mainThreadOk = false;
async function checkServer(){
  const h = await apiFetch('/api/health', API_HEALTH_TIMEOUT);
  if(!h.ok){
    _mainThreadOk = false;
    $('svDot').className = 'dot off';
    $('svText').textContent = '生成服务器离线 — 启动游戏后自动重连';
    return false;
  }
  const m = await apiFetch('/api/mine', API_HEALTH_TIMEOUT);
  if(m.ok){
    _mainThreadOk = true;
    $('svDot').className = 'dot on';
    $('svText').textContent = '已连接 · 主线程就绪';
    return true;
  }
  _mainThreadOk = false;
  $('svDot').className = 'dot warn';
  $('svText').textContent = 'HTTP 已连接, 主线程未响应 — 请进入存档并保持窗口在前台';
  return false;
}
// 生成 = 入队; /api/spawn 只回 {ok, token}. 真正落地要轮询 /api/mine 看到该 token,
// 否则主线程停摆时会假成功 (收到入队回执就报「已生成」).
async function spawnItem(id, btn, count){
  const b = btn, orig = b.textContent, n = Math.max(1, Math.min(999, Math.floor(count) || 1));
  // 原始类只在首次记录: 生成中/已生成会改写 className, 每次都记会把状态类当成原类
  if(!b.dataset.orig) b.dataset.orig = b.className;
  if(!(await checkServer())){ toast('服务器未就绪 — 请进入存档并保持窗口在前台', 'bad'); return; }
  b.disabled = true; b.className = 'btn'; b.textContent = '生成中…';
  const reset = ms => setTimeout(()=>{ b.className = b.dataset.orig || 'btn'; b.textContent=orig; b.disabled=false; }, ms);
  const r = await apiFetch('/api/spawn?itemId=' + encodeURIComponent(id) + '&count=' + n);
  if(!r.ok){
    b.className = 'btn bad'; b.textContent = '失败';
    toast('生成失败: ' + (r.err||''), 'bad'); reset(2200);
    return;
  }
  if(r.token) rememberToken(r.token);
  const landed = r.token ? await waitSpawned(r.token, 40, 250) : true;   // 最多 ~10s
  if(landed){
    b.className = 'btn ok'; b.textContent = '已生成';
    toast('已生成到主背包: ' + id + (n > 1 ? ' ×' + n : ''), 'ok');
    if(S.view === 'mine') refreshMine();
    reset(1800);
  }else{
    b.className = 'btn bad'; b.textContent = '超时';
    toast('已入队但未见产物 — 主线程可能被中断或未进存档 (稍后可在「我的生成」查看)', 'bad');
    reset(2600);
  }
}
// 轮询 /api/mine 直到该 token 出现 (该路径走主线程, 返回即证明 item 已落地)
async function waitSpawned(token, tries, gapMs){
  for(let i=0;i<tries;i++){
    await new Promise(res => setTimeout(res, gapMs));
    const m = await apiFetch('/api/mine', API_TIMEOUT);
    if(m.ok && (m.items||[]).some(x => String(x.token) === String(token))) return true;
  }
  return false;
}
function rememberToken(t){ S.tokens.add(t); saveTokens(); $('myCount').textContent = S.tokens.size; }

// ===== 取数 =====
async function refreshMine(){
  if(!(await checkServer())){ rowList.innerHTML = '<div class="empty">服务器离线 — 启动游戏后重试</div>'; return; }
  const j = await apiFetch('/api/mine');            // 已解析对象
  if(!j.ok){ rowList.innerHTML = '<div class="empty">加载失败: ' + esc(j.err||'') + '</div>'; return; }
  const items = (j.items||[]).filter(x => S.tokens.has(x.token));
  // 服务器已无该 token (被删 / 重启) → 清掉本地死 token, 否则永远留在列表里
  const live = new Set(items.map(x => x.token));
  [...S.tokens].forEach(t => { if(!live.has(t)) S.tokens.delete(t); });
  saveTokens();
  S.mine = items;
  if(S.view === 'mine') renderMine();
  else $('myCount').textContent = items.length;
}

// tag 中文: 优先 TAG_ZH[key]; 剥掉 TYPE-STRING_ 前缀后查 TYPE_ZH / TAG_ZH / TAGNAME_ZH; label 同法兜底
function zhTag(t){
  const T = TAG_ZH_SAFE();
  const k = String(t.key||''), l = String(t.label||'');
  if(T && T[k]) return T[k];
  const kk = k.replace(/^TYPE-STRING_/,'');
  if(kk !== k){
    if(TYPE_ZH[kk]) return TYPE_ZH[kk];
    if(T && T[kk]) return T[kk];
    if(TAGNAME_ZH[kk.toLowerCase()]) return TAGNAME_ZH[kk.toLowerCase()];
  }
  const ll = l.replace(/^TYPE-STRING_/,'');
  if(TYPE_ZH[ll]) return TYPE_ZH[ll];
  if(T && T[ll]) return T[ll];
  if(TAGNAME_ZH[ll.toLowerCase()]) return TAGNAME_ZH[ll.toLowerCase()];
  return l || t.key;
}
// label 是否只是未本地化键的镜像 (TYPE-STRING_* 且能映射) — 是则不再重复显示
function isMirrorLabel(t){
  const l = String(t.label||'');
  if(!l.startsWith('TYPE-STRING_')) return false;
  const ll = l.slice('TYPE-STRING_'.length);
  const T = TAG_ZH_SAFE();
  return !!TYPE_ZH[ll] || !!(T && T[ll]) || !!TAGNAME_ZH[ll.toLowerCase()];
}
function tagHTML(t, modified){
  const m = modified ? '1' : '';
  const on = t.enabled;
  const showL = t.label && !isMirrorLabel(t);
  return `<div class="tr">
    <span class="k" title="key: ${esc(t.key)}">${esc(zhTag(t))}</span>
    <span class="v">${showL ? esc(t.label) + ' · ' : ''}int=${t.valueInt} · str=${esc(t.valueString||'')}</span>
    <select class="tog" data-key="${esc(t.key)}" data-m="${m}">
      <option value="1" ${on?'selected':''}>开</option>
      <option value="0" ${!on?'selected':''}>关</option>
    </select>
    <input class="tval" data-key="${esc(t.key)}" data-m="${m}" value="${esc(t.valueString||'')}" placeholder="字符串值">
    <button class="mini-btn" type="button" data-tval="${esc(t.key)}" data-m="${m}">设值</button>
    <button class="mini-btn danger" type="button" data-rtag="${esc(t.key)}" data-m="${m}">删除</button>
  </div>`;
}
function renderTagsPane(){
  const base = (S.ins && S.ins.tags) || [], mod = (S.ins && S.ins.tagsModified) || [];
  const tb = $('tagBase'), tm = $('tagMod');
  if(tb) tb.innerHTML = base.length ? base.map(t => tagHTML(t,false)).join('') : '<div class="pane-empty">无 base 标签</div>';
  if(tm) tm.innerHTML = mod.length ? mod.map(t => tagHTML(t,true)).join('') : '<div class="pane-empty">无 modified 标签</div>';
  const fs = (S.ins && S.ins.features) || [];
  const el = $('featList');
  if(el){
    el.innerHTML = fs.length ? fs.map(f => {
      const cond = (f.fakeCondition ? '假:' + f.fakeCondition.category : '')
                 + (f.realCondition ? ' 真:' + f.realCondition.category : '');
      return `<div class="tr">
        <span class="k">${esc(f.identifier||f.category||'')}</span>
        <span class="v">${esc(f.category||'')} · 修饰 ${f.valueModifier} · ${f.useCondition?'有假/真条件':''} ${esc(cond)} · ${f.isDisabled?'禁用':'启用'}</span>
        <button class="mini-btn danger" type="button" data-rfeat="${esc(f.identifier||'')}">删除</button>
      </div>`;
    }).join('') : '<div class="pane-empty">无特性 — 香烟 / 邮票 / 模块类物品通常有特性</div>';
  }
  const sel = $('newFeatSel');
  if(sel) sel.onchange = () => {
    const cus = $('newFeatCat');
    if(cus) cus.hidden = sel.value !== '__custom__';
  };
}
// 抽屉内事件委托: 标签与特性的开关 / 设值 / 删除 / 添加
$('dwBody').addEventListener('click', async e => {
  const s = e.target.closest('.tog');
  if(s){
    await insEdit(s.dataset.m ? 'tagModifiedEnabled' : 'tagEnabled', s.dataset.key + '=' + s.value);
    toast('标签已更新', 'ok'); return;
  }
  const sv = e.target.closest('button[data-tval]');
  if(sv){
    const inp = sv.closest('.tr').querySelector('input.tval');
    await insEdit(sv.dataset.m ? 'tagModifiedValue' : 'tagValue', sv.dataset.tval + '=' + (inp ? inp.value : ''));
    toast('已设值', 'ok'); return;
  }
  const rt = e.target.closest('button[data-rtag]');
  if(rt){
    await insEdit(rt.dataset.m ? 'tagModifiedRemove' : 'tagRemove', rt.dataset.rtag);
    toast('标签已删除', 'ok'); setTimeout(loadInstance, 500); return;
  }
  const rf = e.target.closest('button[data-rfeat]');
  if(rf){
    await insEdit('featureRemove', rf.dataset.rfeat);
    toast('特性已删除', 'ok'); setTimeout(loadInstance, 500); return;
  }
  if(e.target.id === 'addTagBtn'){
    const k = $('newTagKey').value.trim(), l = $('newTagLabel').value.trim();
    if(!k){ toast('请填写标签 key', 'bad'); return; }
    await insEdit('tagAdd', k + (l ? '|' + l : ''));
    toast('已添加标签', 'ok'); $('newTagKey').value = ''; $('newTagLabel').value = '';
    setTimeout(loadInstance, 500); return;
  }
  if(e.target.id === 'addFeatBtn'){
    const sel = $('newFeatSel');
    const c = (sel && sel.value !== '__custom__') ? sel.value : ($('newFeatCat').value||'').trim();
    if(!c){ toast('请填写 category', 'bad'); return; }
    await insEdit('featureAdd', c);
    toast('已添加特性: ' + c, 'ok');
    const cus = $('newFeatCat'); if(cus) cus.value = '';
    setTimeout(loadInstance, 500);
  }
});

// ===== 事件 =====
let _searchTimer = 0;
$('search').oninput = e => {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => {
    S.q = e.target.value.trim();
    if(S.view !== 'catalog') setView('catalog'); else renderContent();
  }, 120);
};
$('refreshBtn').onclick = refreshCurrent;
$('densityBtn').onclick = () => setDensity(S.density === 'compact' ? 'comfortable' : 'compact');
document.querySelectorAll('.view-tab').forEach(t => t.onclick = () => setView(t.dataset.view));
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeDrawer();
  // "/" 快速聚焦搜索 (焦点在输入控件内时不触发)
  if(e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    e.preventDefault(); $('search').focus(); $('search').select();
  }
});
// 后台标签页停轮询: 省电, 也避免对主线程做无意义探针
let _pollTimer = 0;
function startPolling(){
  clearInterval(_pollTimer);
  _pollTimer = setInterval(()=>{ if(!document.hidden) checkServer(); }, 5000);
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkServer(); });

// ===== 启动 =====
setDensity(S.density);
setView('catalog');
$('myCount').textContent = S.tokens.size;
checkServer();
startPolling();
</script>
</body>
