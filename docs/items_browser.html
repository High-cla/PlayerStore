/* ============================================================================
   NVIDIA 设计语言 · 暗色适配  (依据 docs/nvdesign.md)
   ----------------------------------------------------------------------------
   与上一版的根本差异: 上一版是「渐变照明系统」(族色辉光 + 卡顶渐变边 + 暖文字),
   那一套被判定违反设计语言, 已整体删除。本版遵守文档的硬规则:

     · 单一强调色 —— NVIDIA Green #76b900 承担全部 CTA / 激活态 / 链接 / 焦点环。
       不引入第二个强调色做分类区分 (文档原话: "Don't add a second accent color
       for variety. The system is intentionally one-color.")
     · 层级只靠字重(400/700)与字号 —— 不靠色相, 不靠底色深浅。
       (文档原话: "Build hierarchy from font weight (400 vs 700) and size,
       not from color tinting.")
     · 卡片 = canvas + 1px hairline, 平贴, 无投影, 无渐变, 无填充面。
       暗色下 canvas 即黑 ⇒ 卡片本就不该着色。--hairline-2 (#5e5e5e) 是
       文档指定的暗色卡缘色。
     · 极端棱角 —— 所有交互元素 rounded.sm = 2px; 无胶囊、无圆角卡片。
     · 无 serif / 无 display 变体 / 无 monospace / 无 italic (typography 规则)。
       ⇒ 上一版内嵌的 IBM Plex Mono 已移除。
     · 8px 基数间距。

   暗色令牌映射(文档浅色 token → 暗色等价):
     canvas #ffffff→#000 ; surface-soft #f7f7f7→#0d0d0d ; surface-elevated →#1a1a1a
     hairline #cccccc→#2a2a2a ; hairline-strong #5e5e5e 保留
     ink #000→#fff ; body #1a1a1a→rgba(255,255,255,.72)
     mute #757575→#8a8a8a ; stone #898989→#9a9a9a ; ash #a7a7a7→#6e6e6e
     link-blue 只用于浅色画布正文; 暗底链接按文档走 primary 绿 ⇒ 不需要蓝色
   ============================================================================ */
:root{
  --bg:#000; --surface:#0d0d0d; --surface-2:#1a1a1a; --surface-3:#262626;
  --hairline:#2a2a2a; --hairline-2:#5e5e5e;
  --ink:#fff; --body:rgba(255,255,255,.72); --mute:#8a8a8a; --stone:#9a9a9a; --ash:#6e6e6e;
  --primary:#76b900; --primary-dark:#5a8d00;
  --error:#e52020; --warning:#df6500; --success:#3f8500;
  --r:2px;
  /* 8px 基数间距 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --font:"Inter","Segoe UI",Arial,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  /* 布局 */
  --topbar:64px; --nav:248px; --drawer:448px; --z-drawer:40; --z-toast:90;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
*{margin:0;padding:0}
html,body{height:100%}
body{font:400 15px/1.5 var(--font);background:var(--bg);color:var(--ink);
  overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;
}
input,select,textarea{font:inherit}
/* 文档: 绿色边框是全系统唯一的 focus 信号 */
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 外壳 ---------- */
/* dvh 优先, vh 兜底: 移动端浏览器地址栏收缩时 vh 会溢出 */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ---------- 顶栏 ---------- */
.topbar{height:var(--topbar);flex-shrink:0;display:flex;align-items:center;gap:var(--s5);
  padding:0 var(--s6);border-bottom:1px solid var(--hairline);background:var(--bg);
  position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;white-space:nowrap}
/* corner-square 作字标 (文档签名装饰, 此处在品牌位) */
.brand-mark{width:12px;height:12px;background:var(--primary);flex-shrink:0;
  display:block;font-size:0;overflow:hidden}
.brand-text{font-weight:700;font-size:17px;line-height:1;letter-spacing:-.005em}
.search-wrap{flex:1;max-width:520px}
.search-wrap input{width:100%;height:44px;padding:0 16px;border-radius:var(--r);
  background:transparent;border:1px solid var(--hairline-2);color:var(--ink);
  font-size:15px;transition:none}
.search-wrap input::placeholder{color:var(--ash)}
.search-wrap input:focus{outline:0;border:2px solid var(--primary);padding:0 15px}
/* 文档无键盘提示键的样式 ⇒ 按 hairline 体系自建, 不引入新色 */
.search-wrap{position:relative}
.search-wrap kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  pointer-events:none;font:400 11px/1 var(--font);color:var(--ash);
  background:transparent;border:1px solid var(--hairline);border-radius:var(--r);
  padding:3px 6px}
.status{display:flex;align-items:center;gap:var(--s2);font-size:12px;color:var(--mute);
  margin-left:auto;white-space:nowrap;max-width:340px;overflow:hidden}
.status span:last-child{overflow:hidden;text-overflow:ellipsis}
/* 状态点: 文档的 semantic 色 */
.dot{width:8px;height:8px;border-radius:50%;background:var(--error);flex-shrink:0}
.dot.on{background:var(--success)}
.dot.off{background:var(--error)}
.icon-btn{width:44px;height:44px;border-radius:var(--r);display:grid;place-items:center;
  color:var(--body);font-size:16px;flex-shrink:0;border:1px solid transparent}
.icon-btn.on{color:var(--primary);border-color:var(--primary)}

/* ---------- 主体分栏 ---------- */
.body{flex:1;display:flex;min-height:0}

/* ---------- 左栏分类导航 ---------- */
.sidebar{width:var(--nav);flex-shrink:0;border-right:1px solid var(--hairline);
  background:var(--bg);display:flex;flex-direction:column;min-height:0}
.nav-scroll{flex:1;overflow-y:auto;padding:0 0 var(--s5)}
.nav-pinned{padding-bottom:var(--s2);border-bottom:1px solid var(--hairline);margin-bottom:var(--s3)}
.nav-group{margin-bottom:var(--s3)}
.nav-group-t{font-weight:700;font-size:14px;line-height:1.43;letter-spacing:.04em;
  color:var(--stone);text-transform:uppercase;padding:var(--s5) var(--s4) var(--s2)}
.nav-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:var(--s2);
  padding:10px var(--s4);min-height:44px;border-radius:var(--r);color:var(--body);
  font-size:15px;line-height:1.5;text-align:left;border:1px solid transparent;background:none}
/* 激活态: 文档用绿字 + 700, 不加底色 */
.nav-item.active{color:var(--primary);font-weight:700}
.nav-item .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .n{font-size:12px;line-height:1;color:var(--stone);flex-shrink:0}
.nav-item.active .n{color:var(--primary)}

/* ---------- 内容区 ---------- */
.content{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{height:56px;flex-shrink:0;display:flex;align-items:center;gap:var(--s2);
  padding:0 var(--s6);border-bottom:1px solid var(--hairline);background:var(--bg);
  position:relative;z-index:4}
.views{display:flex;gap:var(--s2)}
/* 视图切换 = 文档的 button / button-active */
.view-tab{height:36px;padding:0 18px;border:1px solid var(--hairline);border-radius:var(--r);
  background:transparent;color:var(--body);display:inline-flex;align-items:center;gap:6px;
  font-weight:700;font-size:14.4px;line-height:1;white-space:nowrap}
.view-tab.active{background:var(--primary);color:#000;border-color:var(--primary)}
.view-tab .tab-n{font-size:12px;font-weight:400;color:var(--stone)}
.view-tab.active .tab-n{color:#000}
.toolbar-right{margin-left:auto;display:flex;align-items:center;gap:var(--s3)}
.text-btn{height:36px;padding:0 18px;border-radius:var(--r);color:var(--body);
  font-weight:700;font-size:14.4px;border:1px solid var(--hairline)}
.result-count{font-size:12px;line-height:1;color:var(--stone);white-space:nowrap}
.view-extra{flex-shrink:0;padding:var(--s3) var(--s6);border-bottom:1px solid var(--hairline)}
.view-extra:empty{display:none}
.extra-row{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.extra-row input{flex:1;max-width:340px;height:40px;padding:0 12px;background:transparent;
  border:1px solid var(--hairline-2);border-radius:var(--r);color:var(--ink);font-size:14px}
.extra-row input:focus{outline:0;border:2px solid var(--primary);padding:0 11px}
/* 滚动容器 = 纯白纸面, 无环境光 (渐变已整体移除) */
.scroll-area{flex:1;overflow-y:auto;min-height:0;background:var(--bg);padding:var(--s5)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:var(--s3)}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:6px}

/* ---------- 卡片 ----------
   文档 product-card: canvas + 1px hairline, 无投影, 圆角 2px。
   卡片无填充面 —— 中灰底色整体删除, 不引入任何新颜色。 */
.card{position:relative;display:flex;flex-direction:column;gap:var(--s2);
  border:1px solid var(--hairline-2);border-radius:var(--r);padding:var(--s4) 15px var(--s3);
  cursor:pointer;background:none}
.card:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
/* hover 只在有真指针的设备上生效: 触摸设备上 hover 会粘住, 且同时触发 focus 环双重高亮 */
.card>*{position:relative}
/* 等高构造: 标题/英文名/ID 各锁 1 行 + 描述锁 2 行 —— 高度由结构决定, 不由数据决定
   (451 项里 137 项无描述、英文名长度差异极大, 放开就会各行不同高) */
.card-name{font-weight:600;font-size:14.5px;line-height:1.4;letter-spacing:-.005em;
  color:var(--ink);padding-right:34px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card-en{font-size:12px;line-height:1.25;color:var(--stone);
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
/* badge-tag: 文档 caption-md 700 大写 + hairline 描边 (色点已删, 类别降级为文字) */
.card-cats{display:flex;flex-wrap:wrap;gap:5px;min-height:23px}
.cat-chip{display:inline-flex;align-items:center;
  font-weight:700;font-size:11px;line-height:1;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink);border:1px solid var(--hairline-2);border-radius:var(--r);padding:3px 8px}
/* <code> 的浏览器默认字体是等宽 —— 文档禁 monospace, 必须显式继承 */
.card-id{font-family:var(--font);font-size:11px;line-height:1.25;color:var(--mute);
  align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-desc{font-size:12px;line-height:1.55;color:var(--body);
  /* 高度含 padding-top 与 border (box-sizing:border-box): 8+1+2×18.6 = 46.2px → 47px
     v0.6.1 此处为 38px, 未计入 padding 与 border ⇒ 第二行被切一半 (遗留缺陷) */
  height:47px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  padding-top:var(--s2);border-top:1px solid var(--hairline)}
/* 占位态必须与正文同过 AA: rgba(255,255,255,.5) 合成后 ≈5.3, 原 --ash(#6e6e6e) 仅 3.81 */
.card-desc:empty::before{content:"暂无描述";color:rgba(255,255,255,.5)}
.card-foot{margin-top:auto;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
  padding-top:var(--s3);border-top:1px solid var(--hairline);min-height:42px}
.foot-right{margin-left:auto;display:flex;gap:var(--s2)}
.fav{position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:var(--r);
  display:grid;place-items:center;font-size:15px;color:var(--stone);border:1px solid transparent}
.fav.on{color:var(--warning)}
/* button-primary: 绿底黑字, 圆角 2px, 高度 44px (文档触控标准) */
.btn{height:30px;padding:0 13px;border:0;border-radius:var(--r);
  background:var(--primary);color:#000;font-weight:700;font-size:11px;line-height:1;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active{background:var(--primary-dark)}
.btn:disabled{opacity:.6;cursor:progress}
.btn.ok{background:var(--success);color:#fff}
.btn.bad{background:var(--error);color:#fff}
/* button-outline: 透明底 + 白字 + 2px 绿边 (文档原文: text ink, 2px solid primary) */
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--primary);
  padding:0 11px;font-weight:700}
/* destructive(文档 semantic 而非独立色): 描边红字 */
.btn.danger{background:transparent;color:var(--error);border:1px solid var(--error)}
.pill-note{font-size:11px;line-height:1.4;color:var(--mute);display:inline-flex;align-items:center;gap:5px}
.grid.compact .card{padding:10px}
.grid.compact .card-name{font-size:12px}
.grid.compact .card-desc{display:none}
.grid.compact .card-cats{min-height:0}
.grid.compact .card-foot{min-height:0;padding-top:var(--s2)}

/* ---------- 行列表 (库存 / 我的生成) ---------- */
.row-list{padding:var(--s6);display:flex;flex-direction:column;gap:var(--s2)}
.row-list.compact{padding:var(--s3);gap:var(--s1)}
.row{position:relative;display:flex;align-items:center;gap:var(--s3);min-height:64px;
  background:none;border:1px solid var(--hairline-2);border-radius:var(--r);
  padding:var(--s3) var(--s4);cursor:pointer;text-align:left;width:100%}
.row:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
/* 行左侧色条已删 —— 单色体系不用色相区分 (且文档明确禁止左侧色条装饰) */
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-name{font-size:15px;font-weight:700;color:var(--ink);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:12px;line-height:1.4;color:var(--mute);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row-nums{display:flex;gap:var(--s3);flex-shrink:0;font-size:13px;line-height:1;color:var(--body)}
.row-loc{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink);border:1px solid var(--hairline-2);border-radius:var(--r);
  padding:5px 8px;flex-shrink:0;white-space:nowrap}
.row-acts{display:flex;gap:6px;flex-shrink:0}
.mini-btn{height:36px;padding:0 12px;border-radius:var(--r);font-size:13px;
  background:transparent;color:var(--body);border:1px solid var(--hairline-2);white-space:nowrap}
.mini-btn.danger{color:var(--error);border-color:var(--error)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:64px var(--s5);font-size:15px}
.row-list .empty{grid-column:auto}
.empty b{color:var(--ink);font-weight:700}

/* ---------- 右侧抽屉 ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.7);opacity:0;pointer-events:none;
  transition:opacity .18s ease;z-index:var(--z-drawer)}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:var(--drawer);max-width:100vw;
  background:var(--bg);border-left:1px solid var(--hairline);z-index:calc(var(--z-drawer) + 1);
  display:flex;flex-direction:column;transform:translateX(100%);
  transition:transform .2s cubic-bezier(.22,.7,.3,1)}
.drawer.show{transform:translateX(0)}
/* 抽屉顶边发光已删 (渐变整体移除) */
.drawer-head{flex-shrink:0;display:flex;align-items:flex-start;gap:var(--s3);
  padding:var(--s5);border-bottom:1px solid var(--hairline)}
.dh-main{flex:1;min-width:0}
.dh-main h2{font-size:20px;font-weight:700;line-height:1.25;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:32px}
.dh-sub{font-size:12px;line-height:1.5;color:var(--stone);margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-tabs{flex-shrink:0;display:flex;gap:var(--s5);padding:0 var(--s5);
  border-bottom:1px solid var(--hairline)}
.drawer-tabs:empty{display:none}
.drawer-tabs button{padding:14px 0;font-weight:700;font-size:14.4px;line-height:1;
  color:var(--body);border-bottom:2px solid transparent;margin-bottom:-1px}
/* 抽屉 tab 激活: 绿字 + 绿下划线 (文档 tabs 模式) */
.drawer-tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.drawer-body{flex:1;overflow-y:auto;padding:var(--s5)}
.drawer-foot{flex-shrink:0;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
  padding:var(--s3) var(--s5);border-top:1px solid var(--hairline)}
.drawer-foot:empty{display:none}
.pane{display:none}
.pane.show{display:block}
.sec-t{font-weight:700;font-size:14px;line-height:1.43;letter-spacing:.04em;text-transform:uppercase;
  color:var(--stone);margin:var(--s5) 0 var(--s3)}
.sec-t:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px var(--s4);font-size:15px;margin-bottom:var(--s5)}
.kv dt{color:var(--mute);font-size:13px;line-height:1.4}
.kv dd{color:var(--ink);word-break:break-word;font-size:15px;line-height:1.4}
.kv dd.plain{font-family:var(--font)}
.desc-full{font-size:15px;color:var(--body);line-height:1.67;white-space:pre-wrap;
  margin-bottom:var(--s5);border:1px solid var(--hairline-2);border-radius:var(--r);padding:var(--s3)}
.fld{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s2);flex-wrap:wrap}
.fld label{width:110px;flex-shrink:0;color:var(--mute);font-size:13px;text-align:right}
.fld input,.fld textarea{flex:1;min-width:0;background:transparent;border:1px solid var(--hairline-2);
  color:var(--ink);border-radius:var(--r);padding:9px 11px;font-size:14px}
.fld textarea{font-family:inherit;resize:vertical;min-height:56px;line-height:1.5}
.fld input:focus,.fld textarea:focus{outline:0;border:2px solid var(--primary);padding:8px 10px}
.tr{background:none;border:1px solid var(--hairline-2);border-radius:var(--r);
  padding:var(--s2) var(--s3);margin-bottom:6px;display:flex;align-items:center;
  gap:var(--s2);flex-wrap:wrap}
.tr .k{font-size:13px;line-height:1;color:var(--ink);min-width:132px;word-break:break-all}
.tr .v{font-size:12px;line-height:1.4;color:var(--mute);flex:1;min-width:120px}
.tr select,.tr input{background:transparent;border:1px solid var(--hairline-2);color:var(--ink);
  border-radius:var(--r);padding:7px 9px;font-size:13px}
.tr select:focus,.tr input:focus{outline:0;border:2px solid var(--primary);padding:6px 8px}
.tr input.tval{width:132px;flex:none}
.tr .grow{flex:1;min-width:120px}
.pane-empty{color:var(--mute);font-size:15px;text-align:center;padding:var(--s5)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:var(--s5);transform:translate(-50%,16px);z-index:var(--z-toast);
  background:var(--surface-2);border:1px solid var(--hairline-2);color:var(--ink);
  padding:var(--s3) var(--s5);border-radius:var(--r);font-size:14px;
  max-width:min(560px,90vw);opacity:0;pointer-events:none;
  transition:opacity .18s ease,transform .18s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:var(--success)}
.toast.bad{border-color:var(--error)}

/* ---------- 响应式 ----------
   文档断点表: 1024 3-up / 768 2-up / 480 1-up。
   侧栏在窄屏不隐藏 —— 分类是主要导航, 藏了不可达 ⇒ 转横向可滚动分类条。 */
@media (max-width:900px){
  .body{flex-direction:column}
  .sidebar{width:auto;flex:none;display:flex;overflow-x:auto;overflow-y:hidden;
    border-right:0;border-bottom:1px solid var(--hairline);padding:0}
  .nav-scroll{display:flex;padding:0;overflow-x:auto;overflow-y:hidden;width:100%}
  .nav-pinned,.nav-group{display:flex;flex-direction:row;gap:0;border:none;margin:0;padding:0}
  .nav-group-t{display:none}
  .nav-item{width:auto;flex:none;min-height:52px;white-space:nowrap;padding:0 var(--s4);
    border-radius:0;gap:6px}
  .nav-item.active{box-shadow:inset 0 -2px 0 var(--primary)}
  .nav-item .n{font-size:11px}
  .topbar{padding:0 var(--s3);gap:var(--s3)}
  .status{max-width:120px}
  .status span:last-child{display:none}          /* 窄屏只留状态点 */
  .toolbar{padding:0 var(--s3);gap:var(--s3)}
  .view-tab{padding:0 12px;font-size:13px}
  .scroll-area,.row-list{padding:var(--s3)}
  .grid{grid-template-columns:1fr;gap:var(--s2)}
  .grid.compact{grid-template-columns:1fr}
  .drawer{width:100vw;border-left:0}
  .toast{bottom:var(--s3);max-width:calc(100vw - 24px)}
}
@media (max-width:520px){
  .topbar{height:56px;gap:var(--s2)}
  .brand-text{display:none}                       /* 极窄屏只留绿方块字标 */
  .search-wrap kbd{display:none}                  /* 触屏无键盘, 提示键无意义 */
  .search-wrap input{height:40px;padding:0 12px;font-size:14px}
  .search-wrap input:focus{padding:0 11px}
  .status{max-width:none}
  .content .toolbar{height:auto;min-height:52px;flex-wrap:wrap;padding:var(--s2) var(--s3)}
  .toolbar-right{width:100%;margin-left:0;justify-content:space-between}
  .scroll-area{padding:var(--s2)}
  .card{padding:var(--s4)}
  .card-foot{min-height:0}
  .btn{height:44px;padding:0 var(--s4);font-size:14px}
  .btn.ghost{padding:0 16px}
  .foot-right{margin-left:0;width:100%}
  .foot-right .btn{width:100%;justify-content:center}
  .drawer-head,.drawer-body{padding:var(--s4)}
  .drawer-tabs{padding:0 var(--s4)}
  .fld label{width:auto;text-align:left;flex:0 0 100%}
  .kv{grid-template-columns:1fr;gap:2px var(--s3);margin-bottom:var(--s4)}
  .kv dt{margin-top:var(--s2)}
  .row{flex-wrap:wrap;gap:var(--s2)}
  .row-nums{width:100%;justify-content:flex-start}
  .row-acts{width:100%}
  .row-acts .mini-btn{flex:1;justify-content:center}
}
/* ---------- hover ---------- (桌面工具, 只服务鼠标) */
.icon-btn:hover{color:var(--ink);border-color:var(--hairline-2)}
.view-tab:hover{color:var(--ink);border-color:var(--hairline-2)}
.text-btn:hover{color:var(--ink);border-color:var(--hairline-2)}
.fav:hover{color:var(--warning);border-color:var(--hairline-2)}
.btn:hover{background:#8ad100}
.btn.ghost:hover{background:rgba(118,185,0,.12);color:var(--ink)}
.btn.danger:hover{background:var(--error);color:#fff}
.row:hover{border-color:var(--ink)}
.mini-btn:hover{color:var(--ink);border-color:var(--ink)}
.mini-btn.danger:hover{background:var(--error);color:#fff}
.drawer-tabs button:hover{color:var(--ink)}
.nav-item:hover{color:var(--primary)}
.card:hover{border-color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">物品工作台</span>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="搜索 名称 / ID / 描述 — 中英均可" autocomplete="off" aria-label="搜索物品">
      <kbd>/</kbd>
    </div>
    <div class="status" id="status" title="生成服务器状态">
      <span class="dot" id="svDot"></span>
      <span id="svText">检查中…</span>
    </div>
    <button class="icon-btn" id="densityBtn" title="切换密度 (舒适 / 紧凑)" aria-label="切换显示密度">⇕</button>
  </header>

  <div class="body">
    <nav class="sidebar" aria-label="分类导航">
      <div class="nav-scroll" id="navList"></div>
    </nav>
    <main class="content">
      <div class="toolbar">
        <div class="views" role="tablist" aria-label="视图">
          <button class="view-tab" data-view="catalog" role="tab" aria-selected="true">图鉴</button>
          <button class="view-tab" data-view="inventory" role="tab" aria-selected="false">库存 <span class="tab-n" id="invCount">0</span></button>
          <button class="view-tab" data-view="mine" role="tab" aria-selected="false">我的生成 <span class="tab-n" id="myCount">0</span></button>
        </div>
        <div class="toolbar-right">
          <button class="text-btn" id="refreshBtn">刷新</button>
          <span class="result-count" id="count">—</span>
        </div>

// ===== 左栏导航 =====
function renderNav(){
  const counts = catCounts();
  // renderNav 重建 DOM, 记住当前焦点以便键盘连续切换分类
  const focused = (document.activeElement && document.activeElement.dataset) ? document.activeElement.dataset.cat : null;
  const row = (key, label, n) => `
    <button class="nav-item ${S.cat===key?'active':''}" type="button" data-cat="${esc(key)}" aria-pressed="${S.cat===key}">
      <span class="label">${esc(label)}</span><span class="n">${n}</span>
    </button>`;
  let html = '<div class="nav-pinned">'
    + row('ALL','全部物品', ITEMS.length, null)
    + row('FAV','收藏', S.fav.size)
    + '</div>';
  for(const [title, keys] of CAT_GROUPS){
    const present = keys.filter(k => counts[k]);
    if(!present.length) continue;
    html += `<div class="nav-group"><div class="nav-group-t">${esc(title)}</div>`
      + present.map(k => row(k, zCat(k), counts[k])).join('')
      + '</div>';
  }
  navList.innerHTML = html;
  navList.querySelectorAll('.nav-item').forEach(b => b.onclick = () => {
    S.cat = b.dataset.cat;
    if(S.view !== 'catalog') setView('catalog'); else { renderNav(); renderContent(); }
  });
  // 焦点回填: 键盘连续切换分类时焦点不丢 (与重构前行为一致)
  if(focused){
    const again = navList.querySelector('.nav-item[data-cat="' + CSS.escape(focused) + '"]');
    if(again) again.focus();
  }
}

// ===== 视图 =====
function setView(v){
  S.view = v;
  document.querySelectorAll('.view-tab').forEach(t => {
    const on = t.dataset.view === v;
    t.classList.toggle('active', on);
    t.setAttribute('aria-selected', String(on));
  });
  const isCatalog = v === 'catalog';
  grid.hidden = !isCatalog;
  rowList.hidden = isCatalog;
  if(!isCatalog) S.cat = 'ALL';
  renderNav();
  renderViewExtra();
  renderContent();
}
function renderViewExtra(){
  if(S.view === 'catalog'){ viewExtra.innerHTML = ''; return; }
  const isInv = S.view === 'inventory';
  const ph = isInv ? '过滤库存 — 名称 / ID' : '过滤我的生成 — 名称 / ID';
  const hint = isInv ? '点任意行打开检查器, 可编辑字段 / 标签 / 特性或删除' : '本次会话生成的物品; 服务器已无的记录会自动清理';
  viewExtra.innerHTML = `<div class="extra-row">
    <input type="search" id="subSearch" placeholder="${ph}" value="${esc(S.subQ)}" aria-label="${ph}">
    <span class="pill-note">${hint}</span></div>`;
  $('subSearch').oninput = e => { S.subQ = e.target.value; renderContent(); };
}
function setDensity(d){
  S.density = d;
  localStorage.setItem('ps_density', d);
  const compact = d === 'compact';
  grid.classList.toggle('compact', compact);
  rowList.classList.toggle('compact', compact);
  $('densityBtn').classList.toggle('on', compact);
  $('densityBtn').title = compact ? '当前: 紧凑 — 点击切换为舒适' : '当前: 舒适 — 点击切换为紧凑';
}

// ===== 匹配 =====
function matches(i){
  if(S.cat === 'FAV' && !S.fav.has(i.stableId)) return false;
  if(S.cat !== 'ALL' && S.cat !== 'FAV' && !(i.categories||[]).includes(S.cat)) return false;
  if(!S.q) return true;
  const q = S.q.toLowerCase();
  return (i.nameZh||'').toLowerCase().includes(q)
      || (i.nameEn||'').toLowerCase().includes(q)
      || (i.stableId||'').toLowerCase().includes(q)
      || (i.descriptionZh||'').toLowerCase().includes(q)
      || (i.descriptionEn||'').toLowerCase().includes(q);
}
function catChips(cats, max){
  return (cats||[]).slice(0, max).map(c =>
    `<span class="cat-chip">${esc(zCat(c))}</span>`).join('');
}

  else if(S.view === 'inventory') renderInventory();
  else renderMine();
}
function renderCatalog(){
  const list = ITEMS.filter(matches);
  // 收藏置顶, 其余保持数据源顺序 (sort 稳定, 不重排源数组)
  list.sort((a,b) => (S.fav.has(b.stableId)?1:0) - (S.fav.has(a.stableId)?1:0));
  $('count').textContent = list.length + ' / ' + ITEMS.length + ' 项';
  if(!list.length){
    grid.innerHTML = `<div class="empty">没有匹配的物品${S.q ? ` — 没有与「${esc(S.q)}」匹配的结果` : ''}</div>`;
    return;
  }
  grid.innerHTML = list.map(i => {
    const id = i.stableId || '';
    const on = S.fav.has(id);
    const isInstr = id.endsWith('_instruction');
    // 卡片本身不是按钮: 点空白处不弹抽屉 (抽屉只由「详情」按钮开).
    // role=group + aria-label 保证屏幕阅读器仍能成组朗读.

// ===== API 层 =====
// 唯一入口。返回【已解析的对象】—— 调用方不要再 .json(), 那会抛 TypeError。
const API = 'http://localhost:26880';
const API_TIMEOUT = 8000;
// 主线程可能被大存档长时间占用, 探针给更宽预算
const API_HEALTH_TIMEOUT = 15000;
async function apiFetch(path, ms = API_TIMEOUT){
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), ms);
  try{
    const r = await fetch(API + path, { signal: ctl.signal });
    const text = await r.text();
    let j = null;
    if(text){ try{ j = JSON.parse(text); }catch{ j = null; } }
    if(!j) return { ok:false, err:'HTTP ' + r.status + ' 响应非 JSON' };
    if(typeof j.ok === 'undefined') j.ok = r.ok;
    return j;
  }catch(e){
    if(e && e.name === 'AbortError') return { ok:false, err:'请求超时 (' + ms + 'ms) — 主线程可能被大存档占用' };
    return { ok:false, err:String(e) };
  }finally{ clearTimeout(timer); }
}
let _toastTimer = 0;
function toast(msg, cls){
  clearTimeout(_toastTimer);   // 连点时后一条不再被前一条的清零提前打断
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (cls||'');
  _toastTimer = setTimeout(()=>{ t.className = 'toast'; }, 2600);
}
// 两级探针: /api/health 只证明 HTTP 线程存活 (不触主线程); /api/mine 走主线程,
// 才能证明主线程可达 (主线程停摆时点「生成」只会入队而无产物).
// 注意不要武断归因: 主线程不响应可能是失焦暂停 / 大存档卡帧 / 未进存档, 三种都会超时.
// 故直接透出服务端 err 文案 (RouteMine 附带「待处理作业数」便于判断主线程是否在消费).
// 只探 /api/health (HTTP 线程存活即视为连上). 不要拿 /api/mine 当探针或门禁:
// 它走主线程, 只用于「我的生成」列表; 主线程偶尔卡帧会让它超时, 据此判"离线"是误报.
async function checkServer(){
  const h = await apiFetch('/api/health', API_HEALTH_TIMEOUT);
  if(h.ok){
    $('svDot').className = 'dot on';
    $('svText').textContent = '生成服务器已连接 (ProgressMod)';
    return true;
  }
  $('svDot').className = 'dot off';
  $('svText').textContent = '生成服务器离线 — 启动游戏后自动重连';
  return false;
}
// 生成 = 入队; /api/spawn 由 HTTP 线程处理, 回执即结果 (与云端一致).
// 按钮文字与可用状态全程不变: 支持连续点击多次生成 (不变「已生成」, 也不 disable).
async function spawnItem(id, btn, count){
  const n = Math.max(1, Math.min(999, Math.floor(count) || 1));
  try {
    const r = await apiFetch('/api/spawn?itemId=' + encodeURIComponent(id) + '&count=' + n);
    if(!r.ok){ toast('生成失败: ' + (r.err||''), 'bad'); return; }
    if(r.token) rememberToken(r.token);
    toast('已生成: ' + id, 'ok');
    if(S.view === 'mine') refreshMine();
  } catch(e){
    toast('请求失败: ' + e, 'bad');
  }
}
function rememberToken(t){ S.tokens.add(t); saveTokens(); $('myCount').textContent = S.tokens.size; }

// ===== 取数 =====
async function refreshMine(){
  // 不做探针门禁: 直接请求并按真实响应渲染 (探针只会把「主线程暂时卡顿」误报成「服务器离线」, 掩盖真因).
  const j = await apiFetch('/api/mine');            // 已解析对象
  if(!j.ok){ rowList.innerHTML = '<div class="empty">加载失败: ' + esc(j.err||'') + '</div>'; return; }
  const items = (j.items||[]).filter(x => S.tokens.has(x.token));
  // 服务器已无该 token (被删 / 重启) → 清掉本地死 token, 否则永远留在列表里
  const live = new Set(items.map(x => x.token));
  [...S.tokens].forEach(t => { if(!live.has(t)) S.tokens.delete(t); });
  saveTokens();
  S.mine = items;
  if(S.view === 'mine') renderMine();
  else $('myCount').textContent = items.length;
}

// tag 中文: 优先 TAG_ZH[key]; 剥掉 TYPE-STRING_ 前缀后查 TYPE_ZH / TAG_ZH / TAGNAME_ZH; label 同法兜底
function zhTag(t){
  const T = TAG_ZH_SAFE();
  const k = String(t.key||''), l = String(t.label||'');
  if(T && T[k]) return T[k];
  const kk = k.replace(/^TYPE-STRING_/,'');
  if(kk !== k){
    if(TYPE_ZH[kk]) return TYPE_ZH[kk];
    if(T && T[kk]) return T[kk];
    if(TAGNAME_ZH[kk.toLowerCase()]) return TAGNAME_ZH[kk.toLowerCase()];
  }
  const ll = l.replace(/^TYPE-STRING_/,'');
  if(TYPE_ZH[ll]) return TYPE_ZH[ll];
  if(T && T[ll]) return T[ll];
  if(TAGNAME_ZH[ll.toLowerCase()]) return TAGNAME_ZH[ll.toLowerCase()];
  return l || t.key;
}
// label 是否只是未本地化键的镜像 (TYPE-STRING_* 且能映射) — 是则不再重复显示
function isMirrorLabel(t){
  const l = String(t.label||'');
  if(!l.startsWith('TYPE-STRING_')) return false;
  const ll = l.slice('TYPE-STRING_'.length);
  const T = TAG_ZH_SAFE();
  return !!TYPE_ZH[ll] || !!(T && T[ll]) || !!TAGNAME_ZH[ll.toLowerCase()];
}

}
// 抽屉内事件委托: 标签与特性的开关 / 设值 / 删除 / 添加
$('dwBody').addEventListener('click', async e => {
  const s = e.target.closest('.tog');
  if(s){
    await insEdit(s.dataset.m ? 'tagModifiedEnabled' : 'tagEnabled', s.dataset.key + '=' + s.value);
    toast('标签已更新', 'ok'); return;
  }
  const sv = e.target.closest('button[data-tval]');
  if(sv){
    const inp = sv.closest('.tr').querySelector('input.tval');
    await insEdit(sv.dataset.m ? 'tagModifiedValue' : 'tagValue', sv.dataset.tval + '=' + (inp ? inp.value : ''));
    toast('已设值', 'ok'); return;
  }
  const rt = e.target.closest('button[data-rtag]');
  if(rt){
    await insEdit(rt.dataset.m ? 'tagModifiedRemove' : 'tagRemove', rt.dataset.rtag);
    toast('标签已删除', 'ok'); setTimeout(loadInstance, 500); return;
  }
  const rf = e.target.closest('button[data-rfeat]');
  if(rf){
    await insEdit('featureRemove', rf.dataset.rfeat);
    toast('特性已删除', 'ok'); setTimeout(loadInstance, 500); return;
  }
  if(e.target.id === 'addTagBtn'){
    const k = $('newTagKey').value.trim(), l = $('newTagLabel').value.trim();
    if(!k){ toast('请填写标签 key', 'bad'); return; }
    await insEdit('tagAdd', k + (l ? '|' + l : ''));
    toast('已添加标签', 'ok'); $('newTagKey').value = ''; $('newTagLabel').value = '';
    setTimeout(loadInstance, 500); return;
  }
  if(e.target.id === 'addFeatBtn'){
    const sel = $('newFeatSel');
    const c = (sel && sel.value !== '__custom__') ? sel.value : ($('newFeatCat').value||'').trim();
    if(!c){ toast('请填写 category', 'bad'); return; }
    await insEdit('featureAdd', c);
    toast('已添加特性: ' + c, 'ok');
    const cus = $('newFeatCat'); if(cus) cus.value = '';
    setTimeout(loadInstance, 500);
  }
});

// ===== 事件 =====
let _searchTimer = 0;
$('search').oninput = e => {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => {
    S.q = e.target.value.trim();
    if(S.view !== 'catalog') setView('catalog'); else renderContent();
  }, 120);
};
$('refreshBtn').onclick = refreshCurrent;
$('densityBtn').onclick = () => setDensity(S.density === 'compact' ? 'comfortable' : 'compact');
document.querySelectorAll('.view-tab').forEach(t => t.onclick = () => setView(t.dataset.view));
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeDrawer();
  // "/" 快速聚焦搜索 (焦点在输入控件内时不触发)
  if(e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    e.preventDefault(); $('search').focus(); $('search').select();
  }
});
// 后台标签页停轮询: 省电, 也避免对主线程做无意义探针
let _pollTimer = 0;
function startPolling(){
  clearInterval(_pollTimer);
  _pollTimer = setInterval(()=>{ if(!document.hidden) checkServer(); }, 5000);
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkServer(); });

// ===== 启动 =====
setDensity(S.density);
setView('catalog');
$('myCount').textContent = S.tokens.size;
checkServer();
startPolling();
</script>
