<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Probably Stolen 物品浏览器</title>
<style>
/* ============================================================
   设计令牌 — 颜色/间距/圆角/字号/层级/类别身份色的唯一定义处
   改配色只改这里。文本色按 WCAG AA 校准 (小字 >=4.5, UI 元素 >=3.0)
   ============================================================ */
:root{
  /* 背景层级 */
  --bg:#12141a; --bg-raised:#1a1d26; --bg-side:#181b23; --bg-panel:#171a22;
  --bg-card:#1c2029; --bg-input:#212530; --bg-badge:#2a2e3a; --bg-hover:#232834;
  --bg-accent:#2b4a6b; --bg-accent-hi:#345d85;
  --bg-violet:#4a3f8e; --bg-violet-hi:#5a4fae; --bg-violet-alt:#6c5ce7;
  --bg-green:#2b7a4b; --bg-green-hi:#33915c;
  --bg-danger:#c62828; --bg-danger-soft:#3a1f2b; --bg-danger-deep:#7a2432;
  --bg-loc:#241f3a;
  /* 前景 */
  --fg:#e8eaf0; --fg-strong:#eef2f8; --fg-dim:#aeb6c4; --fg-muted:#8a92a0;
  --fg-para:#8f95a1; --fg-faint:#9096a0; --fg-en:#8892a2; --fg-id:#5c93c2;
  --fg-tag:#9aa4b4; --fg-cat:#b8c0cc; --fg-accent:#8ecff7;
  --fg-on-green:#d9ffe8; --fg-on-violet:#ddd6ff;
  /* 描边与语义 */
  --line:#2a2e3a; --line-input:#333a48; --line-accent:#5a9fd4;
  --ok:#4caf50; --bad:#f44336; --warn:#f0b840;
  --dot-idle:#686868; --fav-idle:#646b77; --fg-on-dark:#fff;
  --tag-instr-bg:#876b3a;
  /* 间距 / 圆角 / 字号 / 层级 */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --r-1:5px; --r-2:8px; --r-3:10px; --r-4:14px;
  --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:14px; --fs-xl:16px; --fs-2xl:20px;
  --z-header:10; --z-detail:20; --z-inspector:50; --z-toast:99;
  --font:'Segoe UI','Microsoft YaHei UI',system-ui,sans-serif;
  --font-mono:ui-monospace,Consolas,'Cascadia Mono',monospace;
  /* 类别身份色 */
  --c-access_cards:#f0b840;
  --c-ammunition_explosives:#e8724c;
  --c-armor:#6f9dd8;
  --c-chemicals:#7fc98a;
  --c-containers:#c08a5e;
  --c-currency:#e6c35c;
  --c-documents:#a8b4c8;
  --c-energy_cells:#5fd0d8;
  --c-equipment:#8ab4f8;
  --c-farming:#8fc76a;
  --c-food_drink:#e8946a;
  --c-goods:#d8a24c;
  --c-husbandry:#b9a06a;
  --c-lottery:#e07ab8;
  --c-machines_storage:#9aa8bc;
  --c-materials:#a89a7c;
  --c-medical:#e97a8a;
  --c-medical_chemical:#c98ad8;
  --c-misc:#98a2b0;
  --c-modules:#7ab8e0;
  --c-supplies:#8fd0a8;
  --c-tools:#b0a8d8;
  --c-weapons:#d8785c;
  --c-weapon_mods:#c98a6a;
  --c-random_drop:#f0b840;
  --c-prebuilt:#9d8cf0;
  --c-new_items:#6ee7a8;
}
*{margin:0;padding:0;box-sizing:border-box}
/* 全站键盘焦点环 (含 role=button 的卡片/库存行); 鼠标点击不显示 */
:focus-visible{outline:2px solid var(--fg-accent);outline-offset:2px;border-radius:var(--r-1)}
body{font-family:var(--font);background:var(--bg);color:var(--fg);min-height:100vh}
.push-right{margin-left:auto}
.w-120{width:120px}.w-150{width:150px}
.is-hidden{display:none!important}
header{padding:var(--sp-5) 24px;background:var(--bg-raised);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:var(--z-header)}
header h1{font-size:var(--fs-2xl);color:var(--fg-accent)}
header p{font-size:var(--fs-md);color:var(--fg-muted);margin-top:var(--sp-1)}
header b{color:var(--fg-dim)}
.search-bar{display:flex;gap:var(--sp-3);margin-top:var(--sp-3);flex-wrap:wrap;align-items:center}
.search-bar input[type=text]{flex:1;min-width:260px;padding:10px 14px;border-radius:var(--r-2);border:1px solid var(--line-input);background:var(--bg-input);color:var(--fg);font-size:var(--fs-lg)}
.search-bar input:focus{border-color:var(--line-accent)}
.count-badge{background:var(--bg-badge);padding:var(--sp-2) 14px;border-radius:var(--r-2);font-size:var(--fs-md);color:var(--fg-dim)}
main{display:flex;min-height:calc(100vh - 140px)}
aside{width:240px;padding:var(--sp-4);border-right:1px solid var(--line);background:var(--bg-side);flex-shrink:0}
aside h3{font-size:var(--fs-md);color:var(--fg-accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.cat-list{display:flex;flex-direction:column;gap:2px}
.cat-btn{display:flex;justify-content:space-between;align-items:center;padding:var(--sp-2) 10px;border-radius:var(--r-1);color:var(--fg-cat);cursor:pointer;font-size:var(--fs-md);border:none;background:none;text-align:left;width:100%}
.cat-btn:hover{background:var(--bg-hover);color:var(--fg-on-dark)}
.cat-btn.active{color:var(--fg-accent);font-weight:600;background:var(--bg-accent)}
@supports (background:color-mix(in srgb,red 20%,blue)){.cat-btn.active{background:color-mix(in srgb,var(--cat,var(--fg-accent)) 22%,var(--bg-raised));color:color-mix(in srgb,var(--cat,var(--fg-accent)) 88%,#fff)}}
.cat-btn .n{background:var(--bg-badge);padding:2px var(--sp-2);border-radius:var(--r-4);font-size:var(--fs-xs);color:var(--fg-muted)}
.cat-btn.active .n{background:transparent;color:color-mix(in srgb,var(--cat,var(--fg-accent)) 88%,#fff)}
@supports not (background:color-mix(in srgb,red 20%,blue)){.cat-btn.active .n{color:var(--fg-accent)}}
#grid{flex:1;padding:var(--sp-5);display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--sp-3);align-content:start}
.card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-3);padding:14px;cursor:pointer;transition:transform .1s,border-color .1s;position:relative}
.card:hover{transform:translateY(-2px);border-color:var(--line-accent)}
.fav-btn{position:absolute;top:var(--sp-2);right:var(--sp-2);background:none;border:none;font-size:var(--fs-2xl);cursor:pointer;color:var(--fav-idle);line-height:1;padding:var(--sp-1);z-index:2}
.fav-btn:hover{color:var(--warn)}
.fav-btn.on{color:var(--warn);text-shadow:0 0 6px rgba(240,184,64,.5)}
.card .nm{font-size:var(--fs-lg);font-weight:600;color:var(--fg-strong)}
.card .nm-en{font-size:var(--fs-sm);color:var(--fg-en);margin-top:2px}
.card .cat{display:flex;flex-wrap:wrap;gap:var(--sp-1);margin-top:var(--sp-2)}
.card .tag{font-size:var(--fs-xs);padding:2px var(--sp-2);border-radius:var(--r-4);background:var(--bg-badge);color:var(--fg-tag)}
.tag-instr{background:var(--tag-instr-bg);color:var(--fg-on-dark)}
.card .id{font-size:var(--fs-xs);color:var(--fg-id);margin-top:var(--sp-2);font-family:var(--font-mono)}
.card .desc{font-size:var(--fs-sm);color:var(--fg-para);margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .acts{margin-top:10px}
.detail{position:fixed;right:var(--sp-5);bottom:var(--sp-5);max-width:420px;background:var(--bg-input);border:1px solid var(--line-accent);border-radius:var(--r-3);padding:var(--sp-4);box-shadow:0 var(--sp-2) 30px rgba(0,0,0,.5);display:none;z-index:var(--z-detail)}
.detail.show{display:block}
.detail h2{font-size:var(--fs-xl);color:var(--fg-on-dark)}
.detail .en{color:var(--fg-en);font-size:var(--fs-md);margin:var(--sp-1) 0 10px}
.detail .desc-full{font-size:var(--fs-md);line-height:1.6;color:var(--fg-cat);margin-bottom:var(--sp-3);white-space:pre-wrap}
.detail .meta{font-size:var(--fs-sm);color:var(--fg-muted);display:grid;gap:var(--sp-1)}
.detail .meta b{color:var(--fg-accent);font-weight:500}
#copyId{background:var(--bg-accent);border:none;color:var(--fg-accent);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-2);cursor:pointer;margin-top:var(--sp-3);font-size:var(--fs-md)}
#copyId:hover{background:var(--bg-accent-hi)}
#closeDetail{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--fg-muted);font-size:var(--fs-xl);cursor:pointer}
.empty{grid-column:1/-1;text-align:center;color:var(--fg-faint);padding:60px;font-size:15px}
.server-status{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);color:var(--fg-muted);margin-top:var(--sp-2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dot-idle);display:inline-block;flex-shrink:0}
.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}.dot.warn{background:var(--warn)}
.spawn-btn{background:var(--bg-green);border:none;color:var(--fg-on-green);padding:6px 14px;border-radius:var(--r-2);cursor:pointer;font-size:var(--fs-sm);font-weight:600}
.spawn-btn:hover{background:var(--bg-green-hi)}
.spawn-btn:disabled{opacity:.6;cursor:progress}
.spawn-btn.done{background:var(--ok)}
.spawn-btn.err{background:var(--bg-danger)}
.toast{position:fixed;top:var(--sp-5);right:var(--sp-5);background:var(--bg-input);border:1px solid var(--line-accent);color:var(--fg);padding:var(--sp-3) 18px;border-radius:var(--r-3);font-size:var(--fs-md);z-index:var(--z-toast);opacity:0;transition:opacity .3s;pointer-events:none;max-width:min(420px,90vw)}
.toast.show{opacity:1}
.toast.ok{border-color:var(--ok)}.toast.bad{border-color:var(--bad)}
.mybtn{background:var(--bg-violet);border:none;color:var(--fg-on-violet);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-2);cursor:pointer;font-size:var(--fs-md);font-weight:600}
.mybtn:hover{background:var(--bg-violet-hi)}
.mybtn.on{background:var(--bg-violet-alt)}
#myPanel{display:none;background:var(--bg-side);border-bottom:1px solid var(--line);padding:var(--sp-4) 24px;max-height:50vh;overflow:auto}
#myPanel.show{display:block}
#myPanel h3{color:var(--fg-accent);font-size:var(--fs-lg);margin-bottom:10px}
.my-item{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-2);padding:10px 14px;margin-bottom:var(--sp-2)}
.my-item .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.my-item .nm{font-weight:600;color:var(--fg-strong);font-size:var(--fs-md)}
.my-item .sub{color:var(--fg-muted);font-size:var(--fs-sm)}
.my-item .acts{margin-left:auto;display:flex;gap:6px}
.my-item button{background:var(--bg-badge);border:none;color:var(--fg-cat);padding:var(--sp-1) var(--sp-3);border-radius:var(--r-1);cursor:pointer;font-size:var(--fs-sm)}
.my-item button:hover{background:var(--bg-accent-hi);color:var(--fg-on-dark)}
.my-item button.del{background:var(--bg-danger-soft)}
.my-item button.del:hover{background:var(--bg-danger);color:var(--fg-on-dark)}
.my-empty{color:var(--fg-faint);font-size:var(--fs-md);text-align:center;padding:var(--sp-5)}
#invPanel{display:none;background:var(--bg-side);border-bottom:1px solid var(--line);padding:var(--sp-4) 24px;max-height:55vh;overflow:auto}
#invPanel.show{display:block}
#invPanel h3{color:var(--fg-accent);font-size:var(--fs-lg);margin-bottom:10px}
.inv-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.inv-toolbar input{flex:1;max-width:320px;background:var(--bg-input);border:1px solid var(--line-input);color:var(--fg);border-radius:var(--r-1);padding:6px 10px;font-size:var(--fs-sm)}
.inv-row{display:flex;align-items:center;gap:10px;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-2);padding:var(--sp-2) 14px;margin-bottom:6px;cursor:pointer}
.inv-row:hover{border-color:var(--bg-violet-hi)}
.inv-row .nm{font-weight:600;color:var(--fg-strong);font-size:var(--fs-md);flex:1;min-width:120px}
.inv-row .sub{color:var(--fg-muted);font-size:var(--fs-sm);white-space:nowrap}
.inv-row .loc{color:var(--bg-violet-alt);font-size:var(--fs-xs);background:var(--bg-loc);padding:2px var(--sp-2);border-radius:var(--r-4)}
/* 完整检查器 modal */
#inspector{display:none;position:fixed;inset:0;background:rgba(5,8,14,.78);z-index:var(--z-inspector);align-items:center;justify-content:center}
#inspector.show{display:flex}
.insp-box{background:var(--bg-panel);border:1px solid var(--line-input);border-radius:var(--r-4);max-width:860px;width:92%;max-height:86vh;overflow:auto;padding:var(--sp-5) 24px}
.insp-head{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:14px}
.insp-head h2{margin:0;font-size:18px;color:var(--fg-strong)}
.insp-head .uid{color:var(--fg-muted);font-size:var(--fs-sm);font-family:var(--font-mono)}
.insp-tabs{display:flex;gap:var(--sp-1);border-bottom:1px solid var(--line);margin-bottom:14px}
.insp-tabs button{background:none;border:none;color:var(--fg-muted);padding:var(--sp-2) 18px;cursor:pointer;font-size:var(--fs-md);border-bottom:2px solid transparent}
.insp-tabs button.on{color:var(--fg-accent);border-bottom-color:var(--fg-accent)}
.insp-pane{display:none}
.insp-pane.show{display:block}
.insp-field{display:flex;align-items:center;gap:10px;margin-bottom:var(--sp-2)}
.insp-field label{width:150px;color:var(--fg-muted);font-size:var(--fs-sm);text-align:right;flex-shrink:0}
.insp-field input{flex:1;background:var(--bg-input);border:1px solid var(--line-input);color:var(--fg);border-radius:var(--r-1);padding:var(--sp-1) 9px;font-size:var(--fs-sm)}
.insp-field textarea{flex:1;background:var(--bg-input);border:1px solid var(--line-input);color:var(--fg);border-radius:var(--r-1);padding:var(--sp-1) 9px;font-size:var(--fs-sm);font-family:inherit;min-height:40px}
.insp-section-title{color:var(--fg-accent);font-size:var(--fs-md);margin:var(--sp-4) 0 var(--sp-2);font-weight:600}
.insp-row{display:flex;align-items:center;gap:var(--sp-2);background:var(--bg-card);border:1px solid var(--line);border-radius:6px;padding:var(--sp-1) 10px;margin-bottom:var(--sp-1);flex-wrap:wrap}
.insp-row .k{font-family:var(--font-mono);font-size:var(--fs-sm);color:var(--fg);min-width:140px}
.insp-row .v{font-size:var(--fs-sm);color:var(--fg-muted);flex:1}
.insp-row input{background:var(--bg-input);border:1px solid var(--line-input);color:var(--fg);border-radius:var(--sp-1);padding:3px 7px;font-size:var(--fs-sm);width:150px}
.insp-row select{background:var(--bg-input);border:1px solid var(--line-input);color:var(--fg);border-radius:var(--sp-1);padding:3px 6px;font-size:var(--fs-sm)}
.mini-btn{background:var(--bg-badge);border:none;color:var(--fg-cat);padding:3px 10px;border-radius:var(--r-1);cursor:pointer;font-size:var(--fs-xs)}
.mini-btn:hover{background:var(--bg-accent-hi);color:var(--fg-on-dark)}
.mini-btn.green{background:var(--bg-green);color:var(--fg-on-green)}
.mini-btn.red{background:var(--bg-danger-soft)}
.mini-btn.red:hover{background:var(--bg-danger);color:var(--fg-on-dark)}
.insp-empty{color:var(--fg-faint);font-size:var(--fs-sm);padding:var(--sp-3);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Probably Stolen — 物品浏览器</h1>
  <p>数据源: items_data_full.js（含 30 项 mod 生成器）· 共 <b id="totalCount">0</b> 项 · 支持中英搜索 / 收藏 / 生成 / 库存编辑</p>
  <div class="search-bar">
    <input type="text" id="search" placeholder="搜索名称 / ID / 描述...（支持中英）">
    <span class="count-badge" id="count">0 项</span>
  </div>
  <div class="server-status">
    <span class="dot" id="svDot"></span>
    <span id="svText">检查生成服务器...</span>
    <button class="mybtn" id="invBtn">📦 库存</button>
    <button class="mybtn push-right" id="myBtn">🎒 我的生成 (0)</button>
  </div>
 </header>
 <div class="toast" id="toast" role="status" aria-live="polite"></div>
 <div id="invPanel">
   <h3>📦 全部库存 — 点物品打开完整检查器 (任意库存物品可编辑/删除)</h3>
   <div class="inv-toolbar"><input type="text" id="invSearch" placeholder="过滤 名称/ID..."><span class="count-badge" id="invCount">0 项</span></div>
   <div id="invList"></div>
 </div>
 <div id="myPanel">
   <h3>🎒 我的生成 — 本次会话生成物品 (可编辑属性 / 删除)</h3>
   <div id="myList"></div>
 </div>
<main>
  <aside>
    <h3>分类</h3>
    <div class="cat-list" id="catList"></div>
  </aside>
  <div id="grid"></div>
</main>
<div class="detail" id="detail">
  <button id="closeDetail">×</button>
  <h2 id="dName"></h2>
  <div class="en" id="dEn"></div>
  <div class="desc-full" id="dDesc"></div>
  <div class="meta" id="dMeta"></div>
  <button id="copyId">复制 stableId</button>
 </div>
 <div id="inspector">
   <div class="insp-box">
     <div class="insp-head">
       <h2 id="insName"></h2>
       <span class="uid" id="insUid"></span>
       <span class="push-right">
         <button class="mini-btn red" id="insDelete">🗑 删除物品</button>
         <button class="mini-btn" id="insClose">✕ 关闭</button>
       </span>
     </div>
     <div class="insp-tabs">
       <button data-tab="base" class="on">基础字段</button>
       <button data-tab="tags">标签 (base / modified)</button>
       <button data-tab="features">特性</button>
     </div>
     <div id="insFields"></div>
   </div>
 </div>
<!-- 数据/标签脚本带版本戳: 数据更新时必须同步 bump, 否则浏览器按 max-age 缓存旧副本 -->
<script src="items_data_full.js?v=20260921"></script>
<script src="tag_zh.js?v=20260916"></script>
<script>
// mod 生成引擎合成卡 (参照 ProbablyStolenItemManager.GeneratedEntries): 随机掉落表 + 预置变体
// itemId 传 table:xxx / prebuilt:xxx, ProgressMod 端按前缀分发
const GENERATED_ITEMS = [
  {stableId:'table:junk',nameZh:'随机掉落：杂项',nameEn:'Random drop: Junk',categories:['RANDOM_DROP'],descriptionZh:'从杂项掉落表随机取一件',descriptionEn:'Random item from the junk drop table',kind:'mod-generator'},
  {stableId:'table:access_card',nameZh:'随机掉落：门禁卡',nameEn:'Random drop: Access card',categories:['RANDOM_DROP'],descriptionZh:'从门禁卡掉落表随机取一张',descriptionEn:'Random access card',kind:'mod-generator'},
  {stableId:'table:all_module',nameZh:'随机掉落：全部模块',nameEn:'Random drop: All modules',categories:['RANDOM_DROP'],descriptionZh:'从全模块掉落表随机取一个',descriptionEn:'Random module from the full module table',kind:'mod-generator'},
  {stableId:'table:makeshift_weapon',nameZh:'随机掉落：简易武器',nameEn:'Random drop: Makeshift weapon',categories:['RANDOM_DROP'],descriptionZh:'从简易武器掉落表随机取一件',descriptionEn:'Random makeshift weapon',kind:'mod-generator'},
  {stableId:'table:material',nameZh:'随机掉落：材料',nameEn:'Random drop: Material',categories:['RANDOM_DROP'],descriptionZh:'从材料掉落表随机取一件',descriptionEn:'Random material',kind:'mod-generator'},

function catColor(c){

function renderCats(){
  const c = categoryCounts();
  const keys = ['ALL', 'FAV', ...Object.keys(c).sort()];
  // renderCats 会重建 DOM, 记住焦点以便用键盘连续切换分类
  const focused = (document.activeElement && document.activeElement.dataset) ? document.activeElement.dataset.cat : null;
  catList.innerHTML = keys.map(k => {
    const label = k==='FAV' ? '★收藏' : zCat(k);
    const n = k==='ALL' ? ITEMS.length : (k==='FAV' ? FAVORITES.size : c[k]);
    const on = curCat===k;
    const st = on ? ' style="--cat:' + catColor(k) + '"' : '';
    return `<button class="cat-btn ${on?'active':''}" type="button" data-cat="${esc(k)}" aria-pressed="${on}"${st}>
      <span>${label}</span><span class="n">${n}</span></button>`;
  }).join('');
  catList.querySelectorAll('.cat-btn').forEach(b => b.onclick = () => {
    curCat = b.dataset.cat; renderCats(); renderGrid();
  });
  if(focused){ const again = catList.querySelector('.cat-btn[data-cat="' + CSS.escape(focused) + '"]'); if(again) again.focus(); }
}
function matches(i){
  if(curCat==='FAV' && !FAVORITES.has(i.stableId)) return false;
  if(curCat!=='ALL' && curCat!=='FAV' && !(i.categories||[]).includes(curCat)) return false;
  if(!curSearch) return true;
  const q = curSearch.toLowerCase();
  return (i.nameZh||'').toLowerCase().includes(q) ||
         (i.nameEn||'').toLowerCase().includes(q) ||
         (i.stableId||'').toLowerCase().includes(q) ||
         (i.descriptionZh||'').toLowerCase().includes(q) ||
         (i.descriptionEn||'').toLowerCase().includes(q);
}
function renderGrid(){
  const list = ITEMS.filter(matches);
  list.sort((a,b) => (FAVORITES.has(b.stableId)?1:0) - (FAVORITES.has(a.stableId)?1:0));
  $count.textContent = list.length + ' 项';
  grid.innerHTML = list.length ? list.map(i => {
    const id = i.stableId || '';
    const on = FAVORITES.has(id);
    const isInstr = id.endsWith('_instruction');
    return `<div class="card" data-id="${esc(id)}" role="button" tabindex="0" aria-label="${esc(i.nameZh||i.nameEn||id)}">
      <button class="fav-btn ${on?'on':''}" type="button" data-fav="${esc(id)}" aria-pressed="${on}" aria-label="收藏">${on?'★':'☆'}</button>
      <div class="nm">${esc(i.nameZh||'')}</div>
      <div class="nm-en">${esc(i.nameEn||'')}</div>
      <div class="cat">${(i.categories||[]).slice(0,4).map(c=>`<span class="tag">${zCat(c)}</span>`).join('')}</div>
      <div class="id">${esc(id)}</div>
      <div class="desc">${esc(i.descriptionZh||i.descriptionEn||'')}</div>
      <div class="acts">${isInstr
        ? '<span class="tag tag-instr">📄 图纸(不能直接生成)</span>'
        : `<button class="spawn-btn" type="button" data-spawn="${esc(id)}">生成</button>`}</div>
    </div>`; }).join('') : `<div class="empty">无匹配物品${curSearch ? ' — 没有与「' + esc(curSearch) + '」匹配的结果' : ''}</div>`;
  grid.querySelectorAll('.card').forEach(c => {
    c.onclick = () => showDetail(c.dataset.id);
    c.onkeydown = e => { if(e.key==='Enter' || e.key===' '){ e.preventDefault(); showDetail(c.dataset.id); } };
  });
  grid.querySelectorAll('.fav-btn').forEach(b => b.onclick = (e) => { e.stopPropagation(); toggleFav(b.dataset.fav); });

}

  catch {

      ta.value = id; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();

  $copyId.textContent = ok ? '已复制 ✓' : '复制失败 — 请手动复制';
  setTimeout(()=>{ $copyId.textContent = '复制 stableId'; }, 1800);
};

// ===== API 层: 单一入口 (超时 / JSON 容错 / 统一错误形状) =====
const API = 'http://localhost:26880';
const API_TIMEOUT = 8000;
// 主线程可能被大存档长时间占用, 探针给更宽预算
const API_HEALTH_TIMEOUT = 15000;
async function apiFetch(path, ms = API_TIMEOUT){
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), ms);
  try{
    const r = await fetch(API + path, { signal: ctl.signal });
    const text = await r.text();
    let j = null;
    if(text){ try{ j = JSON.parse(text); }catch{ j = null; } }
    if(!j) return { ok:false, err:'HTTP ' + r.status + ' 响应非 JSON' };
    if(typeof j.ok === 'undefined') j.ok = r.ok;
    return j;
  }catch(e){
    if(e && e.name === 'AbortError') return { ok:false, err:'请求超时 (' + ms + 'ms) — 主线程可能被大存档占用' };
    return { ok:false, err:String(e) };
  }finally{ clearTimeout(timer); }
}
let _toastTimer = 0;
function toast(msg, cls){
  clearTimeout(_toastTimer);          // 连点时后一条不再被前一条的清零提前打断
  $toast.textContent = msg;
  $toast.className = 'toast show ' + (cls||'');
  _toastTimer = setTimeout(()=>{ $toast.className = 'toast'; }, 2600);
}
// 两级探针: /api/health 只证明 HTTP 线程存活 (不触主线程); /api/mine 走 RunOnMainThread,
// 才能证明主线程可达 (未进存档/窗口失焦时主线程排空停摆, 此时点「生成」只会入队而无产物).
async function checkServer(){
  const h = await apiFetch('/api/health', API_HEALTH_TIMEOUT);
  if(!h.ok){
    $svDot.className='dot off';
    $svText.textContent = '生成服务器离线 — 启动游戏(ProgressMod)后自动重连';
    return false;
  }
  const m = await apiFetch('/api/mine', API_HEALTH_TIMEOUT);
  if(m.ok){
    $svDot.className='dot on';
    $svText.textContent='生成服务器已连接 · 主线程就绪';
    return true;
  }
  $svDot.className='dot warn';
  $svText.textContent = 'HTTP 已连接, 主线程未响应 — 请进入存档并保持游戏窗口在前台';
  return false;
}
// 生成 = 入队; /api/spawn 只回 {ok, token}. 真正落地要轮询 /api/mine 看到该 token.
// 旧版收到入队回执就报「已生成」, 主线程停摆时会假成功 — 这里改为确认落地后才报成功.
async function spawnItem(id, btn){
  const b = btn;
  if(!(await checkServer())){ toast('服务器未就绪 — 请进入存档并保持窗口在前台', 'bad'); return; }
  b.disabled = true; b.className = 'spawn-btn'; b.textContent = '生成中...';
  const r = await apiFetch('/api/spawn?itemId=' + encodeURIComponent(id) + '&count=1');
  const reset = (txt, cls, ms) => setTimeout(()=>{ b.className='spawn-btn'; b.textContent='生成'; b.disabled=false; }, ms);
  if(!r.ok){
    b.className = 'spawn-btn err'; b.textContent = '失败';
    toast('生成失败: ' + (r.err||''), 'bad'); reset('', '', 2200);
    return;
  }
  if(r.token) rememberToken(r.token);
  const landed = r.token ? await waitSpawned(r.token, 40, 250) : true;   // 最多 ~10s
  if(landed){
    b.className = 'spawn-btn done'; b.textContent = '已生成 ✓';
    toast('已生成到主背包: ' + id, 'ok'); reset('', '', 1800);
  }else{
    b.className = 'spawn-btn err'; b.textContent = '超时';
    toast('已入队但未见产物 — 主线程可能被中断或未进存档 (可稍后在「我的生成」查看)', 'bad');
    reset('', '', 2600);
  }
}
// 轮询 /api/mine 直到该 token 出现 (该路径走主线程, 返回即证明 item 已落地)
async function waitSpawned(token, tries, gapMs){
  for(let i=0;i<tries;i++){
    await new Promise(res=>setTimeout(res, gapMs));
    const m = await apiFetch('/api/mine', API_TIMEOUT);
    if(m.ok && (m.items||[]).some(x => String(x.token) === String(token))) return true;
  }
  return false;
}
// ===== 🎒 我的生成 (token 追踪) =====
let MY_TOKENS = new Set(JSON.parse(localStorage.getItem('mySpawnTokens') || '[]'));
function rememberToken(t){ MY_TOKENS.add(t); localStorage.setItem('mySpawnTokens', JSON.stringify([...MY_TOKENS])); updateMyBtn(); }
function forgetToken(t){ MY_TOKENS.delete(t); localStorage.setItem('mySpawnTokens', JSON.stringify([...MY_TOKENS])); }
function updateMyBtn(){ $myBtn.textContent = `🎒 我的生成 (${MY_TOKENS.size})`; }
let myShowing = false;
document.getElementById('myBtn').onclick = () => {
  myShowing = !myShowing;
  document.getElementById('myPanel').classList.toggle('show', myShowing);
  document.getElementById('myBtn').classList.toggle('on', myShowing);
  if(myShowing) refreshMine();
};
async function refreshMine(){
  const listEl = $myList;
  if(!(await checkServer())){ listEl.innerHTML = '<div class="my-empty">服务器离线 — 启动游戏后重试</div>'; return; }
  try{
    const r = await apiFetch('/api/mine');
    const j = await r.json();
    const items = (j.items||[]).filter(x => MY_TOKENS.has(x.token));
    // 若服务器已无 (被删/重启), 清掉本地死 token
    const live = new Set(items.map(x=>x.token));
    [...MY_TOKENS].forEach(t => { if(!live.has(t)) MY_TOKENS.delete(t); });
    localStorage.setItem('mySpawnTokens', JSON.stringify([...MY_TOKENS]));
    updateMyBtn();
    if(!items.length){ listEl.innerHTML = '<div class="my-empty">还没有生成记录 — 点卡片「生成」后这里会出现。刷新页面前有效。</div>'; return; }
    listEl.innerHTML = items.map(x => `
      <div class="my-item" data-uid="${x.uid||0}">
        <div class="row1">
          <span class="nm">${esc(x.name||x.id||'')}</span>
          <span class="sub">${esc(x.id||'')} · 数量 ${x.count} · 价值 ${x.unitValue}</span>
          <span class="acts">
            <button class="edit-btn">✎ 完整检查器</button>
            <button class="del-btn del">🗑 删除</button>
          </span>
        </div>
      </div>`).join('');
    listEl.querySelectorAll('.edit-btn').forEach(b => b.onclick = () => {
      const uid = b.closest('.my-item').dataset.uid;
      openInspector(Number(uid));
    });
    listEl.querySelectorAll('.del-btn').forEach(b => b.onclick = async () => {
      const uid = b.closest('.my-item').dataset.uid;
      if(!confirm('删除该物品? (从库存移除并销毁)')) return;
      const rr = await apiFetch('/api/delete?uid=' + uid);
      const jj = await rr.json();
      if(jj.ok){ toast('删除请求已发送', 'ok'); setTimeout(()=>{ refreshMine(); }, 600); }
      else toast('删除失败: ' + (jj.err||''), 'bad');
    });
  }catch(e){ listEl.innerHTML = '<div class="my-empty">加载失败: ' + esc(String(e)) + '</div>'; }
}

let CUR_UID = 0;
async function openInspector(uid){
  if(!(await checkServer())){ toast('服务器离线', 'bad'); return; }
  CUR_UID = uid;
  const box = document.getElementById('inspector');
  box.classList.add('show');

let INS = null;
function renderInspector(item){
  INS = item;

    fieldHTML('短描述','shortDescription',item.shortDescription||'','desc') +
    fieldHTML('长描述','longDescription',item.longDescription||'','desc') +
    fieldHTML('风味文本','flavorText',item.flavorText||'','desc') +
    fieldHTML('自定义文本','customText',item.customText||'','desc') +

    '<div class="insp-section-title">modified 标签 (item.modifiedState)</div><div id="tagMod"></div>' +
    '<div class="insp-section-title">添加标签</div>' +
    '<div class="insp-row"><input id="newTagKey" placeholder="新标签 key"><input id="newTagLabel" placeholder="显示名 (可选)" class="w-150">' +
    '<button class="mini-btn green" id="addTagBtn">+ 添加</button></div>';
  // 特性 tab — 预设下拉 (照原版 ItemManager FeaturePresets 12 项) + 自定义 category
  const FEAT_PRESETS = [
    ['free','免费 / Free'],['retail_markup','零售加价 / Retail markup'],['donation','捐赠 / Donation'],
    ['discounted_buy','折扣购买 / Discounted buy'],['premium_buy','高级购买 / Premium buy'],
    ['cigarette_authenticity','香烟真伪 / Cigarette authenticity'],['stamp_authenticity','邮票真伪 / Stamp authenticity'],
    ['module_stuck','模块卡住 / Module stuck'],['discount_25','25% 折扣 / 25% discount'],
    ['bargain_markup','议价加价 / Bargain markup'],['bargain_discount','议价折扣 / Bargain discount'],
    ['equipment_good','良好装备状态 / Good equipment']
  ];

function fieldHTML(label, field, val, isNum, isDesc){
  const v = esc(String(val ?? ''));
  if(isDesc) return `<div class="insp-field"><label>${label}</label><textarea class="f-${field}" data-field="${field}">${v}</textarea></div>`;
  return `<div class="insp-field"><label>${label}</label><input class="f-${field}" data-field="${field}" ${isNum?'type="number"':''} value="${v}"></div>`;
}
function renderTags(){
  const base = INS.tags||[], mod = INS.tagsModified||[];
  document.getElementById('tagBase').innerHTML = base.length ? base.map(tagHTML).join('') : '<div class="insp-empty">无 base 标签</div>';
  document.getElementById('tagMod').innerHTML = mod.length ? mod.map(t => tagHTML(t,true)).join('') : '<div class="insp-empty">无 modified 标签</div>';
}
// tag 中文: 优先 TAG_ZH[key]; 剥掉 TYPE-STRING_ 前缀后查 TYPE_ZH(物品类型)/TAG_ZH/TAGNAME_ZH(内部属性名); label 同法兜底
function zhTag(t){
  const k = String(t.key||'');
  const l = String(t.label||'');
  if(TAG_ZH && TAG_ZH[k]) return TAG_ZH[k];
  const kk = k.replace(/^TYPE-STRING_/,'');
  if(kk!==k){
    if(TYPE_ZH && TYPE_ZH[kk]) return TYPE_ZH[kk];
    if(TAG_ZH && TAG_ZH[kk]) return TAG_ZH[kk];
    const kkk = kk.toLowerCase();
    if(TAGNAME_ZH && TAGNAME_ZH[kkk]) return TAGNAME_ZH[kkk];
  }
  const ll = l.replace(/^TYPE-STRING_/,'');
  if(TYPE_ZH && TYPE_ZH[ll]) return TYPE_ZH[ll];
  if(TAG_ZH && TAG_ZH[ll]) return TAG_ZH[ll];
  const lll = ll.toLowerCase();
  if(TAGNAME_ZH && TAGNAME_ZH[lll]) return TAGNAME_ZH[lll];
  return l || t.key;
}
// label 是否只是未本地化键的镜像(TYPE-STRING_* 且能映射), 若是则 .v 不重复显示
function isMirrorLabel(t){
  const l = String(t.label||'');
  if(!l.startsWith('TYPE-STRING_')) return false;
  const ll = l.slice('TYPE-STRING_'.length);
  return !!(TYPE_ZH && TYPE_ZH[ll]) || !!(TAG_ZH && TAG_ZH[ll]) || !!(TAGNAME_ZH && TAGNAME_ZH[ll.toLowerCase()]);
}
function tagHTML(t, modified){
  const m = modified ? '&mod' : '';
  const on = t.enabled;
  const showL = t.label && !isMirrorLabel(t);
  return `<div class="insp-row">
    <span class="k" title="key: ${esc(t.key)}">${esc(zhTag(t))}</span>
    <span class="v">${showL ? esc(t.label) + ' · ' : ''}int=${t.valueInt} · str=${esc(t.valueString||'')}</span>
    <select class="tog" data-key="${esc(t.key)}" data-m="${m}">
      <option value="1" ${on?'selected':''}>开</option>
      <option value="0" ${!on?'selected':''}>关</option>
    </select>
    <input class="tval" data-key="${esc(t.key)}" data-m="${m}" value="${esc(t.valueString||'')}" placeholder="字符串值" class="w-120">
    <button class="mini-btn" data-tval="${esc(t.key)}" data-m="${m}">设值</button>
    <button class="mini-btn red" data-rtag="${esc(t.key)}" data-m="${m}">删除</button>
  </div>`;
}
function renderFeats(){
  const fs = INS.features||[];
  const el = document.getElementById('featList');
  el.innerHTML = fs.length ? fs.map(f => {
    const cond = (f.fakeCondition?('假:'+f.fakeCondition.category):'') + (f.realCondition?(' 真:'+f.realCondition.category):'');
