<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Probably Stolen — 物品工作台</title>
<style>
/* ============================================================
   设计系统 — App-shell 工作台 (非文档流)
   这是工具不是文档: 固定外壳 + 分栏独立滚动, 功能各有其位。
   层级: topbar(60) / sidebar(248) / content(auto) / drawer(480 覆盖层)
   令牌是本文件配色与尺度的唯一定义处, 改这里即可整体换肤。
   ============================================================ */
:root{
  /* 表面与描边 */
  --bg:#0d0f13; --surface:#14171d; --surface-2:#1a1e26; --surface-3:#212630;
  --border:#262c37; --border-strong:#333b49;
  /* 前景 — 均对 surface-2 校准过 AA (正文与次要文字 >=4.5) */
  --fg:#e6e9ef; --fg2:#a7b0be; --fg3:#8b95a5;
  --accent:#5aa9f0; --accent-ink:#0b1622; --accent-soft:rgba(90,169,240,.13);
  --ok:#3ecf7a; --warn:#e8b13a; --bad:#ef5a5a;
  --ok-soft:rgba(62,207,122,.13); --warn-soft:rgba(232,177,58,.13); --bad-soft:rgba(239,90,90,.13);
  /* 尺度 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r1:6px; --r2:10px; --r3:14px;
  --t2xs:11px; --txs:12px; --tsm:13px; --tmd:14px; --tlg:16px; --txl:20px; --t2xl:26px;
  /* 布局 */
  --topbar:60px; --nav:248px; --drawer:480px; --z-drawer:40; --z-toast:90;
  --font:'Segoe UI','Microsoft YaHei UI',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
  /* 类别身份色 — 只作小面积点缀 (色点/描边), 不作大面积背景, 故无对比度约束 */
  --c-access_cards:#f0b840; --c-ammunition_explosives:#e8724c; --c-armor:#6f9dd8;
  --c-chemicals:#7fc98a; --c-containers:#c08a5e; --c-currency:#e6c35c;
  --c-documents:#a8b4c8; --c-energy_cells:#5fd0d8; --c-equipment:#8ab4f8;
  --c-farming:#8fc76a; --c-food_drink:#e8946a; --c-goods:#d8a24c;
  --c-husbandry:#b9a06a; --c-lottery:#e07ab8; --c-machines_storage:#9aa8bc;
  --c-materials:#a89a7c; --c-medical:#e97a8a; --c-medical_chemical:#c98ad8;
  --c-misc:#98a2b0; --c-modules:#7ab8e0; --c-supplies:#8fd0a8;
  --c-tools:#b0a8d8; --c-weapons:#d8785c; --c-weapon_mods:#c98a6a;
  --c-random_drop:#f0b840; --c-prebuilt:#9d8cf0; --c-new_items:#6ee7a8;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r1)}
html,body{height:100%}
body{font:var(--tmd)/1.5 var(--font);background:var(--bg);color:var(--fg);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2e3644;border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#3d4759;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 外壳 ---------- */
.app{display:flex;flex-direction:column;height:100vh}

/* ---------- 顶栏: 只放全局项 ---------- */
.topbar{height:var(--topbar);flex-shrink:0;display:flex;align-items:center;gap:var(--s4);
  padding:0 var(--s4);background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:var(--s2);flex-shrink:0}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font:600 var(--tsm)/1 var(--mono);letter-spacing:.5px}
.brand-text{font-weight:600;font-size:var(--tlg);white-space:nowrap}
.search-wrap{flex:1;max-width:560px;position:relative}
.search-wrap input{width:100%;height:36px;padding:0 38px 0 12px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--r2);color:var(--fg);font-size:var(--tmd)}
.search-wrap input::placeholder{color:var(--fg3)}
.search-wrap input:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.search-wrap kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;
  font:var(--t2xs)/1 var(--mono);color:var(--fg3);background:var(--surface-3);
  border:1px solid var(--border);border-radius:4px;padding:3px 6px}
.status{display:flex;align-items:center;gap:var(--s2);font-size:var(--txs);color:var(--fg2);
  margin-left:auto;white-space:nowrap;max-width:340px;overflow:hidden}
.status span:last-child{overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fg3);flex-shrink:0}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.dot.off{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.icon-btn{width:34px;height:34px;border-radius:var(--r1);display:grid;place-items:center;
  color:var(--fg2);font-size:var(--tlg);flex-shrink:0}
.icon-btn:hover{background:var(--surface-3);color:var(--fg)}
.icon-btn.on{background:var(--accent-soft);color:var(--accent)}

/* ---------- 主体分栏 ---------- */
.body{flex:1;display:flex;min-height:0}

/* ---------- 左栏分类导航 ---------- */
.sidebar{width:var(--nav);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0}
.nav-scroll{flex:1;overflow-y:auto;padding:var(--s3) var(--s2) var(--s5)}
.nav-pinned{display:flex;flex-direction:column;gap:2px;padding-bottom:var(--s2);
  border-bottom:1px solid var(--border);margin-bottom:var(--s3)}
.nav-group{margin-bottom:var(--s3)}
.nav-group-t{font-size:var(--t2xs);font-weight:600;letter-spacing:.08em;color:var(--fg3);
  text-transform:uppercase;padding:var(--s2) var(--s3) var(--s1)}
.nav-item{width:100%;display:flex;align-items:center;gap:var(--s2);padding:7px var(--s3);
  border-radius:var(--r1);color:var(--fg2);font-size:var(--tsm);text-align:left}
.nav-item:hover{background:var(--surface-2);color:var(--fg)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .swatch{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.nav-item .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .n{font:var(--t2xs)/1 var(--mono);color:var(--fg3);background:var(--surface-3);
  padding:3px 6px;border-radius:99px;min-width:24px;text-align:center}
.nav-item.active .n{background:transparent;color:var(--accent);padding-right:0}

/* ---------- 内容区 ---------- */
.content{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{height:52px;flex-shrink:0;display:flex;align-items:center;gap:var(--s4);
  padding:0 var(--s5);border-bottom:1px solid var(--border);background:var(--surface)}
.views{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:var(--r2)}
.view-tab{padding:6px 14px;border-radius:7px;font-size:var(--tsm);color:var(--fg2);
  display:flex;align-items:center;gap:6px;white-space:nowrap}
.view-tab:hover{color:var(--fg)}
.view-tab.active{background:var(--surface-3);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.view-tab .tab-n{font:var(--t2xs)/1 var(--mono);color:var(--fg3);background:var(--bg);
  padding:3px 6px;border-radius:99px;min-width:22px;text-align:center}
.view-tab.active .tab-n{color:var(--accent)}
.toolbar-right{margin-left:auto;display:flex;align-items:center;gap:var(--s3)}
.text-btn{padding:6px 12px;border-radius:var(--r1);color:var(--fg2);font-size:var(--tsm);
  border:1px solid var(--border)}
.text-btn:hover{background:var(--surface-2);color:var(--fg);border-color:var(--border-strong)}
.result-count{font:var(--tsm)/1 var(--mono);color:var(--fg3);white-space:nowrap}
.view-extra{flex-shrink:0;padding:var(--s3) var(--s5);border-bottom:1px solid var(--border);background:var(--surface)}
.view-extra:empty{display:none}
.extra-row{display:flex;align-items:center;gap:var(--s3)}
.extra-row input{flex:1;max-width:340px;height:32px;padding:0 10px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--r1);color:var(--fg);font-size:var(--tsm)}
.extra-row input:focus{outline:none;border-color:var(--accent)}
.scroll-area{flex:1;overflow-y:auto;min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--s3);
  padding:var(--s5);align-content:start}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:var(--s2);padding:var(--s3)}

/* ---------- 卡片 ---------- */
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);
  padding:var(--s4);cursor:pointer;display:flex;flex-direction:column;gap:var(--s2);
  transition:border-color .12s,background .12s}
.card:hover{border-color:var(--border-strong);background:var(--surface-2)}
.card-name{font-size:var(--tmd);font-weight:600;color:var(--fg);padding-right:24px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-en{font-size:var(--txs);color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-cats{display:flex;flex-wrap:wrap;gap:5px}
.cat-chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--t2xs);color:var(--fg2);
  background:var(--surface-3);padding:3px 8px;border-radius:99px}
.cat-chip i{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.card-id{font:var(--t2xs)/1.4 var(--mono);color:var(--fg3);background:var(--surface-2);
  padding:3px 7px;border-radius:4px;align-self:flex-start;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-desc{font-size:var(--txs);color:var(--fg2);line-height:1.45;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.card-foot{margin-top:auto;padding-top:var(--s1);display:flex;align-items:center;gap:var(--s2)}
.fav{position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:var(--r1);
  display:grid;place-items:center;font-size:15px;color:var(--fg3);z-index:2}
.fav:hover{background:var(--surface-3);color:var(--warn)}
.fav.on{color:var(--warn)}
.btn{height:30px;padding:0 14px;border-radius:var(--r1);font-size:var(--txs);font-weight:600;
  background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.6;cursor:progress}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;color:var(--fg2);border:1px solid var(--border);font-weight:500}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg);border-color:var(--border-strong)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:#fff}
.pill-note{font-size:var(--t2xs);color:var(--fg3);display:inline-flex;align-items:center;gap:5px}
.grid.compact .card{padding:10px;gap:5px}
.grid.compact .card-name{font-size:var(--tsm)}
.grid.compact .card-desc{display:none}
.grid.compact .card-id{font-size:10px}

/* ---------- 行列表 (库存 / 我的生成) ---------- */
.row-list{padding:var(--s5);display:flex;flex-direction:column;gap:6px}
.row-list.compact{padding:var(--s3);gap:4px}
.row{display:flex;align-items:center;gap:var(--s3);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r2);padding:var(--s3) var(--s4);cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--border-strong);background:var(--surface-2)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-name{font-size:var(--tsm);font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font:var(--t2xs)/1.4 var(--mono);color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-nums{display:flex;gap:var(--s3);flex-shrink:0;font:var(--txs)/1 var(--mono);color:var(--fg2)}
.row-loc{font-size:var(--t2xs);color:var(--accent);background:var(--accent-soft);
  padding:3px 9px;border-radius:99px;flex-shrink:0;white-space:nowrap}
.row-acts{display:flex;gap:6px;flex-shrink:0}
.mini-btn{height:26px;padding:0 10px;border-radius:var(--r1);font-size:var(--t2xs);
  background:var(--surface-3);color:var(--fg2)}
.mini-btn:hover{background:var(--accent);color:var(--accent-ink)}
.mini-btn.danger{background:var(--bad-soft);color:var(--bad)}
.mini-btn.danger:hover{background:var(--bad);color:#fff}
.empty{grid-column:1/-1;text-align:center;color:var(--fg3);padding:64px var(--s5);font-size:var(--tsm)}
.row-list .empty{grid-column:auto}
.empty b{color:var(--fg2)}

/* ---------- 右侧抽屉: 图鉴信息 + 库存实例编辑的唯一入口 ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,7,11,.55);opacity:0;pointer-events:none;
  transition:opacity .16s;z-index:var(--z-drawer)}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:var(--drawer);max-width:100vw;background:var(--surface);
  border-left:1px solid var(--border-strong);z-index:calc(var(--z-drawer) + 1);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .18s ease;box-shadow:-16px 0 40px rgba(0,0,0,.4)}
.drawer.show{transform:translateX(0)}
.drawer-head{flex-shrink:0;display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s4) var(--s5);
  border-bottom:1px solid var(--border)}
.dh-main{flex:1;min-width:0}
.dh-main h2{font-size:var(--tlg);font-weight:600;color:var(--fg);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.dh-sub{font:var(--txs)/1.5 var(--mono);color:var(--fg3);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-tabs{flex-shrink:0;display:flex;gap:2px;padding:var(--s2) var(--s4) 0;border-bottom:1px solid var(--border)}
.drawer-tabs:empty{display:none}
.drawer-tabs button{padding:8px 14px;font-size:var(--tsm);color:var(--fg3);border-bottom:2px solid transparent;
  margin-bottom:-1px}
.drawer-tabs button:hover{color:var(--fg2)}
.drawer-tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.drawer-body{flex:1;overflow-y:auto;padding:var(--s4) var(--s5)}
.drawer-foot{flex-shrink:0;display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s5);
  border-top:1px solid var(--border);background:var(--surface-2)}
.drawer-foot:empty{display:none}
.pane{display:none}
.pane.show{display:block}
.sec-t{font-size:var(--txs);font-weight:600;color:var(--fg2);letter-spacing:.04em;
  margin:var(--s4) 0 var(--s2);padding-bottom:6px;border-bottom:1px solid var(--border)}
.sec-t:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:88px 1fr;gap:7px var(--s3);font-size:var(--txs);margin-bottom:var(--s3)}
.kv dt{color:var(--fg3)}
.kv dd{color:var(--fg2);word-break:break-word;font-family:var(--mono)}
.kv dd.plain{font-family:var(--font)}
.desc-full{font-size:var(--tsm);color:var(--fg2);line-height:1.65;white-space:pre-wrap;margin-bottom:var(--s3)}
.fld{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s2)}
.fld label{width:104px;flex-shrink:0;color:var(--fg3);font-size:var(--txs);text-align:right}
.fld input,.fld textarea{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--border);
  color:var(--fg);border-radius:var(--r1);padding:7px 10px;font-size:var(--tsm)}
.fld textarea{font-family:inherit;resize:vertical;min-height:52px;line-height:1.5}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.tr{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r1);
  padding:var(--s2) var(--s3);margin-bottom:6px;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.tr .k{font:var(--txs)/1 var(--mono);color:var(--fg);min-width:132px}
.tr .v{font:var(--t2xs)/1.4 var(--mono);color:var(--fg3);flex:1;min-width:120px}
.tr select,.tr input{background:var(--bg);border:1px solid var(--border);color:var(--fg);
  border-radius:5px;padding:5px 8px;font-size:var(--txs)}
.tr input.tval{width:132px;flex:none}
.pane-empty{color:var(--fg3);font-size:var(--tsm);text-align:center;padding:var(--s5)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:var(--s5);transform:translate(-50%,16px);z-index:var(--z-toast);
  background:var(--surface-3);border:1px solid var(--border-strong);color:var(--fg);
  padding:var(--s3) var(--s5);border-radius:var(--r2);font-size:var(--tsm);max-width:min(560px,90vw);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  box-shadow:0 8px 28px rgba(0,0,0,.45)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:var(--ok)}.toast.bad{border-color:var(--bad)}

/* 窄屏: 左栏转为横向分类条, 不隐藏 (隐藏会让分类不可达) */
@media (max-width:900px){
  .body{flex-direction:column}
  .sidebar{width:100%;max-height:150px;border-right:none;border-bottom:1px solid var(--border)}
  .nav-scroll{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:var(--s2)}
  .nav-pinned,.nav-group{display:flex;flex-direction:row;gap:6px;border:none;margin:0;padding:0}
  .nav-group-t{display:none}
  .nav-item{width:auto;white-space:nowrap;padding:6px 10px}
  .drawer{width:100vw}
  .toolbar{padding:0 var(--s3)}
  .grid,.row-list{padding:var(--s3)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">PS</span>
      <span class="brand-text">物品工作台</span>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="搜索 名称 / ID / 描述 — 中英均可" autocomplete="off" aria-label="搜索物品">
      <kbd>/</kbd>
    </div>
    <div class="status" id="status" title="生成服务器状态">
      <span class="dot" id="svDot"></span>
      <span id="svText">检查中…</span>
    </div>
    <button class="icon-btn" id="densityBtn" title="切换密度 (舒适 / 紧凑)" aria-label="切换显示密度">⇕</button>
  </header>

  <div class="body">
    <nav class="sidebar" aria-label="分类导航">
      <div class="nav-scroll" id="navList"></div>
    </nav>
    <main class="content">
      <div class="toolbar">
        <div class="views" role="tablist" aria-label="视图">
          <button class="view-tab" data-view="catalog" role="tab" aria-selected="true">图鉴</button>
          <button class="view-tab" data-view="inventory" role="tab" aria-selected="false">库存 <span class="tab-n" id="invCount">0</span></button>
          <button class="view-tab" data-view="mine" role="tab" aria-selected="false">我的生成 <span class="tab-n" id="myCount">0</span></button>
        </div>
        <div class="toolbar-right">
          <button class="text-btn" id="refreshBtn">刷新</button>
          <span class="result-count" id="count">—</span>
        </div>
      </div>
      <div class="view-extra" id="viewExtra"></div>
      <div class="scroll-area" id="scrollArea">
        <div class="grid" id="grid"></div>
        <div class="row-list" id="rowList" hidden></div>
      </div>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="物品详情">
    <div class="drawer-head">

// ===== 左栏导航 =====
function renderNav(){
  const counts = catCounts();
  // renderNav 重建 DOM, 记住当前焦点以便键盘连续切换分类
  const focused = (document.activeElement && document.activeElement.dataset) ? document.activeElement.dataset.cat : null;
  const row = (key, label, n, dot) => `
    <button class="nav-item ${S.cat===key?'active':''}" type="button" data-cat="${esc(key)}" aria-pressed="${S.cat===key}">
      ${dot ? `<i class="swatch" style="background:${dot}"></i>` : ''}
      <span class="label">${esc(label)}</span><span class="n">${n}</span>
    </button>`;
  let html = '<div class="nav-pinned">'
    + row('ALL','全部物品', ITEMS.length, null)
    + row('FAV','收藏', S.fav.size, ROOT_CS.getPropertyValue('--warn').trim())
    + '</div>';
  for(const [title, keys] of CAT_GROUPS){
    const present = keys.filter(k => counts[k]);
    if(!present.length) continue;
    html += `<div class="nav-group"><div class="nav-group-t">${esc(title)}</div>`
      + present.map(k => row(k, zCat(k), counts[k], catColor(k))).join('')
      + '</div>';
  }
  navList.innerHTML = html;
  navList.querySelectorAll('.nav-item').forEach(b => b.onclick = () => {
    S.cat = b.dataset.cat;
    if(S.view !== 'catalog') setView('catalog'); else { renderNav(); renderContent(); }
  });
  // 焦点回填: 键盘连续切换分类时焦点不丢 (与重构前行为一致)
  if(focused){
    const again = navList.querySelector('.nav-item[data-cat="' + CSS.escape(focused) + '"]');
    if(again) again.focus();
  }
}

// ===== 视图 =====
function setView(v){
  S.view = v;
  document.querySelectorAll('.view-tab').forEach(t => {
    const on = t.dataset.view === v;
    t.classList.toggle('active', on);
    t.setAttribute('aria-selected', String(on));
  });
  const isCatalog = v === 'catalog';
  grid.hidden = !isCatalog;
  rowList.hidden = isCatalog;
  if(!isCatalog) S.cat = 'ALL';
  renderNav();
  renderViewExtra();
  renderContent();
}
function renderViewExtra(){
  if(S.view === 'catalog'){ viewExtra.innerHTML = ''; return; }
  const isInv = S.view === 'inventory';
  const ph = isInv ? '过滤库存 — 名称 / ID' : '过滤我的生成 — 名称 / ID';
  const hint = isInv ? '点任意行打开检查器, 可编辑字段 / 标签 / 特性或删除' : '本次会话生成的物品; 服务器已无的记录会自动清理';
  viewExtra.innerHTML = `<div class="extra-row">
    <input type="search" id="subSearch" placeholder="${ph}" value="${esc(S.subQ)}" aria-label="${ph}">
    <span class="pill-note">${hint}</span></div>`;
  $('subSearch').oninput = e => { S.subQ = e.target.value; renderContent(); };
}
function setDensity(d){
  S.density = d;
  localStorage.setItem('ps_density', d);
  const compact = d === 'compact';
  grid.classList.toggle('compact', compact);
  rowList.classList.toggle('compact', compact);
  $('densityBtn').classList.toggle('on', compact);
  $('densityBtn').title = compact ? '当前: 紧凑 — 点击切换为舒适' : '当前: 舒适 — 点击切换为紧凑';
}

// ===== 匹配 =====
function matches(i){
  if(S.cat === 'FAV' && !S.fav.has(i.stableId)) return false;
  if(S.cat !== 'ALL' && S.cat !== 'FAV' && !(i.categories||[]).includes(S.cat)) return false;
  if(!S.q) return true;
  const q = S.q.toLowerCase();
  return (i.nameZh||'').toLowerCase().includes(q)
      || (i.nameEn||'').toLowerCase().includes(q)
      || (i.stableId||'').toLowerCase().includes(q)
      || (i.descriptionZh||'').toLowerCase().includes(q)
      || (i.descriptionEn||'').toLowerCase().includes(q);
}
function catChips(cats, max){
  return (cats||[]).slice(0, max).map(c =>
    `<span class="cat-chip"><i style="background:${catColor(c)}"></i>${esc(zCat(c))}</span>`).join('');
}

// ===== API 层 =====
// 唯一入口。返回【已解析的对象】—— 调用方不要再 .json(), 那会抛 TypeError。
const API = 'http://localhost:26880';
const API_TIMEOUT = 8000;
// 主线程可能被大存档长时间占用, 探针给更宽预算
const API_HEALTH_TIMEOUT = 15000;
async function apiFetch(path, ms = API_TIMEOUT){
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), ms);
  try{
    const r = await fetch(API + path, { signal: ctl.signal });
    const text = await r.text();
    let j = null;
    if(text){ try{ j = JSON.parse(text); }catch{ j = null; } }
    if(!j) return { ok:false, err:'HTTP ' + r.status + ' 响应非 JSON' };
    if(typeof j.ok === 'undefined') j.ok = r.ok;
    return j;
  }catch(e){
    if(e && e.name === 'AbortError') return { ok:false, err:'请求超时 (' + ms + 'ms) — 主线程可能被大存档占用' };
    return { ok:false, err:String(e) };
  }finally{ clearTimeout(timer); }
}
let _toastTimer = 0;
function toast(msg, cls){
  clearTimeout(_toastTimer);   // 连点时后一条不再被前一条的清零提前打断
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (cls||'');
  _toastTimer = setTimeout(()=>{ t.className = 'toast'; }, 2600);
}
// 两级探针: /api/health 只证明 HTTP 线程存活 (不触主线程); /api/mine 走主线程,
// 才能证明主线程可达 (未进存档/窗口失焦时主线程排空停摆, 此时点「生成」只会入队而无产物).
let _mainThreadOk = false;
async function checkServer(){
  const h = await apiFetch('/api/health', API_HEALTH_TIMEOUT);
  if(!h.ok){
    _mainThreadOk = false;
    $('svDot').className = 'dot off';
    $('svText').textContent = '生成服务器离线 — 启动游戏后自动重连';
    return false;
  }
  const m = await apiFetch('/api/mine', API_HEALTH_TIMEOUT);
  if(m.ok){
    _mainThreadOk = true;
    $('svDot').className = 'dot on';
    $('svText').textContent = '已连接 · 主线程就绪';
    return true;
  }
  _mainThreadOk = false;
  $('svDot').className = 'dot warn';
  $('svText').textContent = 'HTTP 已连接, 主线程未响应 — 请进入存档并保持窗口在前台';
  return false;
}
// 生成 = 入队; /api/spawn 只回 {ok, token}. 真正落地要轮询 /api/mine 看到该 token,
// 否则主线程停摆时会假成功 (收到入队回执就报「已生成」).
async function spawnItem(id, btn){
  const b = btn, orig = b.textContent;
  if(!(await checkServer())){ toast('服务器未就绪 — 请进入存档并保持窗口在前台', 'bad'); return; }
  b.disabled = true; b.className = 'btn'; b.textContent = '生成中…';
  const reset = ms => setTimeout(()=>{ b.className='btn'; b.textContent=orig; b.disabled=false; }, ms);
  const r = await apiFetch('/api/spawn?itemId=' + encodeURIComponent(id) + '&count=1');
  if(!r.ok){
    b.className = 'btn bad'; b.textContent = '失败';
    toast('生成失败: ' + (r.err||''), 'bad'); reset(2200);
    return;
  }
  if(r.token) rememberToken(r.token);
  const landed = r.token ? await waitSpawned(r.token, 40, 250) : true;   // 最多 ~10s
  if(landed){
    b.className = 'btn ok'; b.textContent = '已生成';
    toast('已生成到主背包: ' + id, 'ok');
    if(S.view === 'mine') refreshMine();
    reset(1800);
  }else{
    b.className = 'btn bad'; b.textContent = '超时';
    toast('已入队但未见产物 — 主线程可能被中断或未进存档 (稍后可在「我的生成」查看)', 'bad');
    reset(2600);
  }
}
// 轮询 /api/mine 直到该 token 出现 (该路径走主线程, 返回即证明 item 已落地)
async function waitSpawned(token, tries, gapMs){
  for(let i=0;i<tries;i++){
    await new Promise(res => setTimeout(res, gapMs));
    const m = await apiFetch('/api/mine', API_TIMEOUT);
    if(m.ok && (m.items||[]).some(x => String(x.token) === String(token))) return true;
  }
  return false;
}
function rememberToken(t){ S.tokens.add(t); saveTokens(); $('myCount').textContent = S.tokens.size; }

// ===== 取数 =====
async function refreshMine(){
  if(!(await checkServer())){ rowList.innerHTML = '<div class="empty">服务器离线 — 启动游戏后重试</div>'; return; }
  const j = await apiFetch('/api/mine');            // 已解析对象
  if(!j.ok){ rowList.innerHTML = '<div class="empty">加载失败: ' + esc(j.err||'') + '</div>'; return; }
  const items = (j.items||[]).filter(x => S.tokens.has(x.token));
  // 服务器已无该 token (被删 / 重启) → 清掉本地死 token, 否则永远留在列表里
  const live = new Set(items.map(x => x.token));
  [...S.tokens].forEach(t => { if(!live.has(t)) S.tokens.delete(t); });
  saveTokens();
  S.mine = items;
  if(S.view === 'mine') renderMine();
  else $('myCount').textContent = items.length;
}

  if(!(await checkServer())){ rowList.innerHTML = '<div class="empty">服务器离线 — 启动游戏后重试</div>'; return; }

// tag 中文: 优先 TAG_ZH[key]; 剥掉 TYPE-STRING_ 前缀后查 TYPE_ZH / TAG_ZH / TAGNAME_ZH; label 同法兜底
function zhTag(t){
  const T = TAG_ZH_SAFE();
  const k = String(t.key||''), l = String(t.label||'');
  if(T && T[k]) return T[k];
  const kk = k.replace(/^TYPE-STRING_/,'');
  if(kk !== k){
    if(TYPE_ZH[kk]) return TYPE_ZH[kk];
    if(T && T[kk]) return T[kk];
    if(TAGNAME_ZH[kk.toLowerCase()]) return TAGNAME_ZH[kk.toLowerCase()];
  }
  const ll = l.replace(/^TYPE-STRING_/,'');
  if(TYPE_ZH[ll]) return TYPE_ZH[ll];
  if(T && T[ll]) return T[ll];
  if(TAGNAME_ZH[ll.toLowerCase()]) return TAGNAME_ZH[ll.toLowerCase()];
  return l || t.key;
}
// label 是否只是未本地化键的镜像 (TYPE-STRING_* 且能映射) — 是则不再重复显示
function isMirrorLabel(t){
  const l = String(t.label||'');
  if(!l.startsWith('TYPE-STRING_')) return false;
  const ll = l.slice('TYPE-STRING_'.length);
  const T = TAG_ZH_SAFE();
  return !!TYPE_ZH[ll] || !!(T && T[ll]) || !!TAGNAME_ZH[ll.toLowerCase()];
}

    <span class="v">${showL ? esc(t.label) + ' · ' : ''}int=${t.valueInt} · str=${esc(t.valueString||'')}</span>
    <select class="tog" data-key="${esc(t.key)}" data-m="${m}">

      <option value="0" ${!on?'selected':''}>关</option>

    <input class="tval" data-key="${esc(t.key)}" data-m="${m}" value="${esc(t.valueString||'')}" placeholder="字符串值">
    <button class="mini-btn" type="button" data-tval="${esc(t.key)}" data-m="${m}">设值</button>
    <button class="mini-btn danger" type="button" data-rtag="${esc(t.key)}" data-m="${m}">删除</button>
  </div>`;
}
function renderTagsPane(){
  const base = (S.ins && S.ins.tags) || [], mod = (S.ins && S.ins.tagsModified) || [];
  const tb = $('tagBase'), tm = $('tagMod');
  if(tb) tb.innerHTML = base.length ? base.map(t => tagHTML(t,false)).join('') : '<div class="pane-empty">无 base 标签</div>';
  if(tm) tm.innerHTML = mod.length ? mod.map(t => tagHTML(t,true)).join('') : '<div class="pane-empty">无 modified 标签</div>';
  const fs = (S.ins && S.ins.features) || [];
  const el = $('featList');
  if(el){
    el.innerHTML = fs.length ? fs.map(f => {
      const cond = (f.fakeCondition ? '假:' + f.fakeCondition.category : '')
                 + (f.realCondition ? ' 真:' + f.realCondition.category : '');
      return `<div class="tr">
        <span class="k">${esc(f.identifier||f.category||'')}</span>
        <span class="v">${esc(f.category||'')} · 修饰 ${f.valueModifier} · ${f.useCondition?'有假/真条件':''} ${esc(cond)} · ${f.isDisabled?'禁用':'启用'}</span>
        <button class="mini-btn danger" type="button" data-rfeat="${esc(f.identifier||'')}">删除</button>
      </div>`;
    }).join('') : '<div class="pane-empty">无特性 — 香烟 / 邮票 / 模块类物品通常有特性</div>';
  }
  const sel = $('newFeatSel');
  if(sel) sel.onchange = () => {
    const cus = $('newFeatCat');
    if(cus) cus.hidden = sel.value !== '__custom__';
  };
}
// 抽屉内事件委托: 标签与特性的开关 / 设值 / 删除 / 添加
$('dwBody').addEventListener('click', async e => {
  const s = e.target.closest('.tog');
  if(s){
    await insEdit(s.dataset.m ? 'tagModifiedEnabled' : 'tagEnabled', s.dataset.key + '=' + s.value);
    toast('标签已更新', 'ok'); return;
  }
  const sv = e.target.closest('button[data-tval]');
  if(sv){
    const inp = sv.closest('.tr').querySelector('input.tval');
    await insEdit(sv.dataset.m ? 'tagModifiedValue' : 'tagValue', sv.dataset.tval + '=' + (inp ? inp.value : ''));
    toast('已设值', 'ok'); return;
  }
  const rt = e.target.closest('button[data-rtag]');
  if(rt){
    await insEdit(rt.dataset.m ? 'tagModifiedRemove' : 'tagRemove', rt.dataset.rtag);
    toast('标签已删除', 'ok'); setTimeout(loadInstance, 500); return;
  }
  const rf = e.target.closest('button[data-rfeat]');
  if(rf){
    await insEdit('featureRemove', rf.dataset.rfeat);
    toast('特性已删除', 'ok'); setTimeout(loadInstance, 500); return;
  }
  if(e.target.id === 'addTagBtn'){
    const k = $('newTagKey').value.trim(), l = $('newTagLabel').value.trim();
    if(!k){ toast('请填写标签 key', 'bad'); return; }
    await insEdit('tagAdd', k + (l ? '|' + l : ''));
    toast('已添加标签', 'ok'); $('newTagKey').value = ''; $('newTagLabel').value = '';
    setTimeout(loadInstance, 500); return;
  }
  if(e.target.id === 'addFeatBtn'){
    const sel = $('newFeatSel');
    const c = (sel && sel.value !== '__custom__') ? sel.value : ($('newFeatCat').value||'').trim();
    if(!c){ toast('请填写 category', 'bad'); return; }
    await insEdit('featureAdd', c);
    toast('已添加特性: ' + c, 'ok');
    const cus = $('newFeatCat'); if(cus) cus.value = '';
    setTimeout(loadInstance, 500);
  }
});

// ===== 事件 =====
let _searchTimer = 0;
$('search').oninput = e => {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => {
    S.q = e.target.value.trim();
    if(S.view !== 'catalog') setView('catalog'); else renderContent();
  }, 120);
};
$('refreshBtn').onclick = refreshCurrent;
$('densityBtn').onclick = () => setDensity(S.density === 'compact' ? 'comfortable' : 'compact');
document.querySelectorAll('.view-tab').forEach(t => t.onclick = () => setView(t.dataset.view));
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeDrawer();
  // "/" 快速聚焦搜索 (焦点在输入控件内时不触发)
  if(e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    e.preventDefault(); $('search').focus(); $('search').select();
  }
});
// 后台标签页停轮询: 省电, 也避免对主线程做无意义探针
let _pollTimer = 0;
function startPolling(){
  clearInterval(_pollTimer);
  _pollTimer = setInterval(()=>{ if(!document.hidden) checkServer(); }, 5000);
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkServer(); });

// ===== 启动 =====
setDensity(S.density);
setView('catalog');
$('myCount').textContent = S.tokens.size;
checkServer();
startPolling();
</script>
</body>
