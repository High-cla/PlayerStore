<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#12141a;color:#e8eaf0;min-height:100vh}
header{padding:20px 24px;background:#1a1d26;border-bottom:1px solid #2a2e3a;position:sticky;top:0;z-index:10}
header h1{font-size:20px;color:#8ecff7}
header p{font-size:13px;color:#7a8290;margin-top:4px}
.search-bar{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;align-items:center}
.search-bar input[type=text]{flex:1;min-width:260px;padding:10px 14px;border-radius:8px;border:1px solid #333a48;background:#212530;color:#e8eaf0;font-size:14px}
.search-bar input:focus{outline:none;border-color:#5a9fd4}
.count-badge{background:#2a2e3a;padding:8px 14px;border-radius:8px;font-size:13px;color:#aeb6c4}
main{display:flex;min-height:calc(100vh - 140px)}
aside{width:240px;padding:16px;border-right:1px solid #2a2e3a;background:#181b23;flex-shrink:0}

.cat-list{display:flex;flex-direction:column;gap:2px}
.cat-btn{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;color:#b8c0cc;cursor:pointer;font-size:13px;border:none;background:none;text-align:left;width:100%}
.cat-btn:hover{background:#232834;color:#fff}
.cat-btn.active{background:#2b4a6b;color:#8ecff7;font-weight:600}
.cat-btn .n{background:#2a2e3a;padding:2px 8px;border-radius:10px;font-size:11px;color:#8a92a0}
#grid{flex:1;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;align-content:start}
.card{background:#1c2029;border:1px solid #2a2e3a;border-radius:10px;padding:14px;cursor:pointer;transition:transform .1s,border-color .1s;position:relative}
.card:hover{transform:translateY(-2px);border-color:#5a9fd4}
.fav-btn{position:absolute;top:8px;right:8px;background:none;border:none;font-size:20px;cursor:pointer;color:#4a5260;line-height:1;padding:4px;z-index:2}
.fav-btn:hover{color:#f0b840}
.fav-btn.on{color:#f0b840;text-shadow:0 0 6px rgba(240,184,64,.5)}
.card .nm{font-size:14px;font-weight:600;color:#eef2f8}
.card .nm-en{font-size:12px;color:#8892a2;margin-top:2px}
.card .cat{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.card .tag{font-size:10px;padding:2px 8px;border-radius:10px;background:#2a2e3a;color:#9aa4b4}
.card .id{font-size:11px;color:#5c93c2;margin-top:8px;font-family:monospace}
.card .desc{font-size:12px;color:#7a8290;margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.detail{position:fixed;right:20px;bottom:20px;max-width:420px;background:#212530;border:1px solid #5a9fd4;border-radius:12px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:none;z-index:20}
.detail.show{display:block}
.detail h2{font-size:16px;color:#fff}
.detail .en{color:#8892a2;font-size:13px;margin:4px 0 10px}
.detail .desc-full{font-size:13px;line-height:1.6;color:#b8c0cc;margin-bottom:12px;white-space:pre-wrap}
.detail .meta{font-size:12px;color:#8a92a0;display:grid;gap:4px}
.detail .meta b{color:#8ecff7;font-weight:500}
#copyId{background:#2b4a6b;border:none;color:#8ecff7;padding:8px 16px;border-radius:8px;cursor:pointer;margin-top:12px;font-size:13px}
#copyId:hover{background:#345d85}
#closeDetail{position:absolute;top:10px;right:14px;background:none;border:none;color:#7a8290;font-size:18px;cursor:pointer}
.empty{grid-column:1/-1;text-align:center;color:#6a7280;padding:60px;font-size:15px}
.server-status{display:flex;align-items:center;gap:8px;font-size:12px;color:#8a92a0;margin-top:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#555;display:inline-block}
.dot.on{background:#4caf50}.dot.off{background:#f44336}
.spawn-btn{background:#2b7a4b;border:none;color:#d9ffe8;padding:6px 14px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600}
.spawn-btn:hover{background:#33915c}
.spawn-btn.done{background:#4caf50}
.spawn-btn.err{background:#c62828}
.toast{position:fixed;top:20px;right:20px;background:#212530;border:1px solid #5a9fd4;color:#e8eaf0;padding:12px 18px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.ok{border-color:#4caf50}.toast.bad{border-color:#f44336}
.mybtn{background:#4a3f8e;border:none;color:#ddd6ff;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.mybtn:hover{background:#5a4fae}
.mybtn.on{background:#6c5ce7}
#myPanel{display:none;background:#181b23;border-bottom:1px solid #2a2e3a;padding:16px 24px;max-height:50vh;overflow:auto}
#myPanel.show{display:block}
#myPanel h3{color:#8ecff7;font-size:14px;margin-bottom:10px}
.my-item{background:#1c2029;border:1px solid #2a2e3a;border-radius:8px;padding:10px 14px;margin-bottom:8px}
.my-item .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.my-item .nm{font-weight:600;color:#eef2f8;font-size:13px}
.my-item .sub{color:#8a92a0;font-size:12px}
.my-item .acts{margin-left:auto;display:flex;gap:6px}
.my-item button{background:#2a2e3a;border:none;color:#b8c0cc;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.my-item button:hover{background:#345d85;color:#fff}
.my-item button.del{background:#3a1f2b}
.my-item button.del:hover{background:#c62828;color:#fff}
.edit-form{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed #2a2e3a}
.edit-form.show{display:block}
.edit-form label{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#8a92a0;margin:4px 8px 4px 0}
.edit-form input{background:#212530;border:1px solid #333a48;color:#e8eaf0;border-radius:5px;padding:4px 8px;font-size:12px;width:110px}
.edit-form input.wide{width:220px}
.edit-form .apply{background:#2b7a4b;color:#d9ffe8;font-weight:600}
.my-empty{color:#6a7280;font-size:13px;text-align:center;padding:20px}
#invPanel{display:none;background:#181b23;border-bottom:1px solid #2a2e3a;padding:16px 24px;max-height:55vh;overflow:auto}
#invPanel.show{display:block}
#invPanel h3{color:#8ecff7;font-size:14px;margin-bottom:10px}

.inv-row{display:flex;align-items:center;gap:10px;background:#1c2029;border:1px solid #2a2e3a;border-radius:8px;padding:8px 14px;margin-bottom:6px;cursor:pointer}

.insp-tabs{display:flex;gap:4px;border-bottom:1px solid #2a2e3a;margin-bottom:14px}

.insp-section-title{color:#8ecff7;font-size:13px;margin:16px 0 8px;font-weight:600}
.insp-row{display:flex;align-items:center;gap:8px;background:#1c2029;border:1px solid #2a2e3a;border-radius:6px;padding:5px 10px;margin-bottom:5px;flex-wrap:wrap}
.insp-row .k{font-family:monospace;font-size:12px;color:#e8eaf0;min-width:140px}
.insp-row .v{font-size:12px;color:#8a92a0;flex:1}
.insp-row input{background:#212530;border:1px solid #333a48;color:#e8eaf0;border-radius:4px;padding:3px 7px;font-size:12px;width:150px}
.insp-row select{background:#212530;border:1px solid #333a48;color:#e8eaf0;border-radius:4px;padding:3px 6px;font-size:12px}
.mini-btn{background:#2a2e3a;border:none;color:#b8c0cc;padding:3px 10px;border-radius:5px;cursor:pointer;font-size:11px}
.mini-btn:hover{background:#345d85;color:#fff}
.mini-btn.green{background:#2b7a4b;color:#d9ffe8}
.mini-btn.red{background:#3a1f2b}
.mini-btn.red:hover{background:#c62828;color:#fff}
.insp-actions{margin-top:16px;display:flex;gap:8px;justify-content:flex-end}
.big-btn{background:#5a4fae;border:none;color:#fff;padding:7px 18px;border-radius:7px;cursor:pointer;font-size:13px}
.big-btn.red{background:#7a2432}
.big-btn.red:hover{background:#c62828}
.big-btn:hover{background:#6c5ce7}
.insp-empty{color:#6a7280;font-size:12px;padding:12px;text-align:center}
</style>
</head>

<header>

  <div class="search-bar">

  </div>

 <div class="toast" id="toast"></div>

<main>

function categoryCounts(){

}
function renderCats(){
  const c = categoryCounts();

  catList.innerHTML = keys.map(k => {
    const label = k==='FAV' ? '★收藏' : zCat(k);
    const n = k==='ALL' ? ITEMS.length : (k==='FAV' ? FAVORITES.size : c[k]);

function matches(i){
  if(curCat==='FAV' && !FAVORITES.has(i.stableId)) return false;
  if(curCat!=='ALL' && curCat!=='FAV' && !(i.categories||[]).includes(curCat)) return false;
  if(!curSearch) return true;
  const q = curSearch.toLowerCase();
  return (i.nameZh||'').toLowerCase().includes(q) ||
         (i.nameEn||'').toLowerCase().includes(q) ||
         (i.stableId||'').toLowerCase().includes(q) ||
         (i.descriptionZh||'').toLowerCase().includes(q) ||
         (i.descriptionEn||'').toLowerCase().includes(q);
}

async function checkServer(){
  const dot = document.getElementById('svDot');
  const txt = document.getElementById('svText');
  try{
    const r = await fetch(API + '/api/health');
    if(r.ok){ dot.className='dot on'; txt.textContent='生成服务器已连接 (ProgressMod)'; return true; }
    throw 0;
  }catch(e){
    dot.className='dot off'; txt.textContent='生成服务器离线 — 启动游戏(ProgressMod)后自动重连';
    return false;

async function spawnItem(id, btn){
  if(!(await checkServer())){ toast('服务器离线, 请先打开游戏', 'bad'); return; }
  btn.classList.add('done'); btn.disabled = true;
  btn.textContent = '生成中...';
  try{
    const r = await fetch(API + '/api/spawn?itemId=' + encodeURIComponent(id) + '&count=1');
    const j = await r.json();
    if(j.ok){
      btn.className='spawn-btn done'; btn.textContent='已生成 ✓';
      toast('已生成: ' + id + ' ×1', 'ok');
      if(j.token) rememberToken(j.token);
    }
    else { btn.className='spawn-btn err'; btn.textContent='失败'; toast('生成失败: ' + (j.err||''), 'bad'); }
  }catch(e){
    btn.className='spawn-btn err'; btn.textContent='失败';
    toast('请求失败: ' + e, 'bad');
  }
  setTimeout(()=>{ btn.className='spawn-btn'; btn.textContent='生成 ×1'; btn.disabled=false; }, 2500);
}

let MY_TOKENS = new Set(JSON.parse(localStorage.getItem('mySpawnTokens') || '[]'));
function rememberToken(t){ MY_TOKENS.add(t); localStorage.setItem('mySpawnTokens', JSON.stringify([...MY_TOKENS])); updateMyBtn(); }
function forgetToken(t){ MY_TOKENS.delete(t); localStorage.setItem('mySpawnTokens', JSON.stringify([...MY_TOKENS])); }
function updateMyBtn(){ document.getElementById('myBtn').textContent = `🎒 我的生成 (${MY_TOKENS.size})`; }
let myShowing = false;
document.getElementById('myBtn').onclick = () => {
  myShowing = !myShowing;
  document.getElementById('myPanel').classList.toggle('show', myShowing);
  document.getElementById('myBtn').classList.toggle('on', myShowing);
  if(myShowing) refreshMine();
};
async function refreshMine(){
  const listEl = document.getElementById('myList');
  if(!(await checkServer())){ listEl.innerHTML = '<div class="my-empty">服务器离线 — 启动游戏后重试</div>'; return; }
  try{
    const r = await fetch(API + '/api/mine');
    const j = await r.json();
    const items = (j.items||[]).filter(x => MY_TOKENS.has(x.token));
    // 若服务器已无 (被删/重启), 清掉本地死 token
    const live = new Set(items.map(x=>x.token));
    [...MY_TOKENS].forEach(t => { if(!live.has(t)) MY_TOKENS.delete(t); });
    localStorage.setItem('mySpawnTokens', JSON.stringify([...MY_TOKENS]));
    updateMyBtn();
    if(!items.length){ listEl.innerHTML = '<div class="my-empty">还没有生成记录 — 点卡片「生成 ×1」后这里会出现。刷新页面前有效。</div>'; return; }
    listEl.innerHTML = items.map(x => `
      <div class="my-item" data-uid="${x.uid||0}">
        <div class="row1">
          <span class="nm">${esc(x.name||x.id||'')}</span>
          <span class="sub">${esc(x.id||'')} · 数量 ${x.count} · 价值 ${x.unitValue}</span>
          <span class="acts">
            <button class="edit-btn">✎ 完整检查器</button>
            <button class="del-btn del">🗑 删除</button>
          </span>
        </div>
      </div>`).join('');
    listEl.querySelectorAll('.edit-btn').forEach(b => b.onclick = () => {
      const uid = b.closest('.my-item').dataset.uid;
      openInspector(Number(uid));
    });
    listEl.querySelectorAll('.del-btn').forEach(b => b.onclick = async () => {
      const uid = b.closest('.my-item').dataset.uid;
      if(!confirm('删除该物品? (从库存移除并销毁)')) return;
      const rr = await fetch(API + '/api/delete?uid=' + uid);
      const jj = await rr.json();
      if(jj.ok){ toast('删除请求已发送', 'ok'); setTimeout(()=>{ refreshMine(); }, 600); }
      else toast('删除失败: ' + (jj.err||''), 'bad');
    });
  }catch(e){ listEl.innerHTML = '<div class="my-empty">加载失败: ' + esc(String(e)) + '</div>'; }
}

  if(!(await checkServer())){ toast('服务器离线', 'bad'); return; }

function fieldHTML(label, field, val, isNum, isDesc){
  const v = esc(String(val ?? ''));

  return `<div class="insp-field"><label>${label}</label><input class="f-${field}" data-field="${field}" ${isNum?'type="number"':''} value="${v}"></div>`;
}

document.getElementById('insClose').onclick = () => { document.getElementById('inspector').classList.remove('show'); };
document.getElementById('insDelete').onclick = async () => {
  if(!confirm('确定删除该物品? 将从库存移除并销毁。')) return;
  const rr = await fetch(API + '/api/delete?uid=' + CUR_UID);
  const jj = await rr.json();
  if(jj.ok){ toast('删除请求已发送', 'ok'); document.getElementById('inspector').classList.remove('show'); setTimeout(()=>{ if(invShowing) refreshInv(); refreshMine(); }, 600); }
  else toast('删除失败: ' + (jj.err||''), 'bad');
};
document.body.addEventListener('click', e => {
  const b = e.target.closest('[data-spawn]');
  if(b) spawnItem(b.dataset.spawn, b);
});
setInterval(()=>{ const d = document.querySelector('.dot'); checkServer(); }, 5000);
checkServer();
